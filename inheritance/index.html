<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inheritance · Born, Not Made</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101010;color:#eee;font:16px/1.55 Inter,Arial,"Microsoft YaHei",sans-serif}
main{width:min(880px,100%);margin:auto;padding:clamp(24px,6vw,66px) clamp(22px,5vw,58px)}
header,footer{display:flex;align-items:center;justify-content:space-between}a,button{color:#bbb;font:inherit;font-size:14px}a{text-decoration:none}button{background:none;border:0;padding:8px 0;cursor:pointer}a:hover,button:hover{color:white}h1{font:normal clamp(36px,6vw,60px)/1.2 Georgia,"Songti SC",SimSun,serif;margin:40px 0 36px}
ol{list-style:none;padding:0;margin:0}li{position:relative;display:grid;grid-template-columns:52px 1fr;column-gap:18px;align-items:center;padding:0 0 44px}
li:last-child{padding-bottom:0}li:not(:last-child):after{content:"";position:absolute;left:23px;top:54px;bottom:4px;border-left:1px solid #565656}
.letter{font:normal 40px Georgia,serif;text-align:center;color:#eee}.words{margin:0}.trace{width:144px;height:22px;display:block;margin-top:5px;fill:none;stroke:#ddd;stroke-width:1.4;stroke-linecap:round}
.draw .trace path{stroke-dasharray:1;stroke-dashoffset:1;animation:write 1.3s ease-out forwards}.draw li:nth-child(2) .old{animation-delay:1.2s}.draw li:nth-child(2) .new{animation-delay:2.4s}.draw li:nth-child(3) path{animation-delay:3.5s}
@keyframes write{to{stroke-dashoffset:0}}footer{margin-top:28px}
@media(prefers-reduced-motion:reduce){.draw .trace path{animation:none;stroke-dashoffset:0}}
</style></head>
<body><main>
<header><a href="../#inheritance" target="_top">Born, Not Made</a><button id="lang" type="button">English</button></header>
<h1 id="title">记忆的继承</h1>
<ol id="lineage">
<li><span class="letter">A</span><div><p class="words">A 在相遇中形成记忆。</p><svg class="trace" viewBox="0 0 144 22" aria-hidden="true"><path class="old" pathLength="1" d="M2 16 H20 C27 16 27 3 34 3 S41 16 49 16 H62"/></svg></div></li>
<li><span class="letter">B</span><div><p class="words">B 继承 A 的记忆，也有了自己的经历。</p><svg class="trace" viewBox="0 0 144 22" aria-hidden="true"><path class="old" pathLength="1" d="M2 16 H20 C27 16 27 3 34 3 S41 16 49 16 H62"/><path class="new" pathLength="1" d="M62 16 H71 Q76 16 79 10 T87 10 T95 10 T103 10 Q106 16 112 16 H130"/></svg></div></li>
<li><span class="letter">C</span><div><p class="words">C 继承 B 的记忆。</p><svg class="trace" viewBox="0 0 144 22" aria-hidden="true"><path pathLength="1" d="M2 16 H20 C27 16 27 3 34 3 S41 16 49 16 H71 Q76 16 79 10 T87 10 T95 10 T103 10 Q106 16 112 16 H130"/></svg></div></li>
</ol>
<footer><button id="replay" type="button">重播</button></footer>
</main><script>
const lineage=document.getElementById('lineage');
const language=document.getElementById('lang');
const replay=document.getElementById('replay');
const title=document.getElementById('title');
const words=lineage.querySelectorAll('.words');
const text={
 zh:['记忆的继承','A 在相遇中形成记忆。','B 继承 A 的记忆，也有了自己的经历。','C 继承 B 的记忆。','重播','English'],
 en:['Memory inheritance','A forms a memory through an encounter.','B inherits A’s memory and adds an experience of its own.','C inherits B’s memory.','Replay','中文']
};
let lang=new URLSearchParams(location.search).get('lang')==='zh'?'zh':'en';
function translate(){
 const lines=text[lang];document.documentElement.lang=lang;title.textContent=lines[0];
 words.forEach((el,i)=>el.textContent=lines[i+1]);replay.textContent=lines[4];language.textContent=lines[5];
}
function animate(){lineage.classList.remove('draw');void lineage.offsetWidth;lineage.classList.add('draw')}
language.onclick=()=>{lang=lang==='zh'?'en':'zh';translate()};
replay.onclick=animate;translate();animate();
</script></body></html>
