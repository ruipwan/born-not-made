<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inheritance · Born, Not Made</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101010;color:#eee;font:16px/1.55 Inter,Arial,"Microsoft YaHei",sans-serif}
main{width:min(880px,100%);margin:auto;padding:clamp(24px,6vw,66px) clamp(22px,5vw,58px)}
header,footer{display:flex;align-items:center;justify-content:space-between}a,button{color:#bbb;font:inherit;font-size:14px}a{text-decoration:none}button{background:none;border:0;padding:8px 0;cursor:pointer}a:hover,button:hover{color:white}h1{font:normal clamp(36px,6vw,60px)/1.2 Georgia,"Songti SC",SimSun,serif;margin:40px 0 36px}
#diagram{position:relative}#lineage{list-style:none;margin:0;padding:0 0 0 clamp(105px,22%,158px)}li{height:64px;display:flex;flex-direction:column;justify-content:center}.gen{font-weight:600}.words{margin:3px 0 0;color:#c8c8c8}.via{height:54px;font-size:12px;color:#999}canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}footer{margin-top:28px}@media(max-width:520px){li{height:90px}.via{height:52px}main{padding:20px}h1{margin:26px 0}.words{font-size:14px}}</style></head>
<body><main>
<header><a href="../#inheritance" target="_top">Born, Not Made</a><button id="lang" type="button">English</button></header>
<h1 id="title">记忆的继承</h1>
<div id="diagram"><canvas aria-hidden="true"></canvas><ol id="lineage">
<li><span class="gen">第一代</span><p class="words">与人互动，形成记忆。</p></li>
<li class="via">模型蒸馏</li>
<li><span class="gen">第二代</span><p class="words">继承上一代的部分记忆，在新的互动中积累自己的记忆。</p></li>
<li class="via">模型蒸馏</li>
<li><span class="gen">第三代</span><p class="words">继承第二代留下的记忆，继续成长。</p></li>
</ol></div>
<footer><button id="replay" type="button">重播</button></footer>
</main><script>
const lineage=document.getElementById('lineage');
const language=document.getElementById('lang');
const replay=document.getElementById('replay');
const title=document.getElementById('title');
const generations=[["第一代","与人互动，形成记忆。","Generation 1","Encounters with people become memories."],["第二代","继承上一代的部分记忆，在新的互动中积累自己的记忆。","Generation 2","Inherits part of the first generation’s memory and forms memories of its own."],["第三代","继承第二代留下的记忆，继续成长。","Generation 3","Inherits memory from the second generation and continues to grow."]];
const words=lineage.querySelectorAll('.words');
let lang=new URLSearchParams(location.search).get('lang')==='zh'?'zh':'en';
function translate(){
 const zh=lang==='zh';document.documentElement.lang=lang;title.textContent=zh?'记忆的继承':'Memory inheritance';
 words.forEach((el,i)=>{el.previousElementSibling.textContent=generations[i][zh?0:2];el.textContent=generations[i][zh?1:3]});
 lineage.querySelectorAll('.via').forEach(el=>el.textContent=zh?'模型蒸馏':'Model distillation');
 replay.textContent=zh?'重播':'Replay';language.textContent=zh?'English':'中文';
}

// A memory is a small constellation. Descendants retain a subset and acquire new points.
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');
const rows=[...document.querySelectorAll('#lineage li')];
const inherited=[0,2,3,5,7,8,10,11,13,15,17];
const next=[0,1,3,5,6,8,10,11,12,14,15];
function field(n,phase){
 return Array.from({length:n},(_,i)=>{
  const a=i*2.39996+phase,r=Math.sqrt((i+.6)/n);
  return [Math.cos(a)*r*30,Math.sin(a)*r*22+Math.cos(2*a)*3];
 });
}
const a=field(18,.5);
const b=inherited.map(i=>a[i].map(v=>v*.82)).concat(field(6,.8).map(([x,y])=>[x*.42+23,y*.68+3]));
const c=next.map(i=>b[i].map(v=>v*.87)).concat(field(4,.4).map(([x,y])=>[x*.4-21,y*.5+5]));
const end=15;
function ramp(t,start,span){const u=Math.min(1,Math.max(0,(t-start)/span));return u*u*(3-2*u)}
let raf,start,time=0,layout;
function size(){
 const w=canvas.clientWidth,h=canvas.clientHeight,ratio=Math.min(2,devicePixelRatio||1);
 canvas.width=Math.round(w*ratio);canvas.height=Math.round(h*ratio);ctx.setTransform(ratio,0,0,ratio,0,0);
 const guide=rows[0].getBoundingClientRect().left-canvas.getBoundingClientRect().left;
 layout={x:guide*.49,y:[0,2,4].map(i=>rows[i].offsetTop+rows[i].offsetHeight/2),w,h};
 render(time);
}
function dot(x,y,alpha,r=2.1){
 if(alpha<=0)return;ctx.fillStyle='rgba(238,238,238,'+alpha+')';ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
}
function render(t){
 time=t;const {x,y,w,h}=layout;ctx.clearRect(0,0,w,h);
 rows.forEach((row,i)=>row.style.opacity=.12+.88*ramp(t,[0,2.3,4.4,8.9,11][i],1));
 function dots(points,row,from,to,begin,span){
  for(let i=from;i<to;i++){const u=ramp(t,begin+(i-from)*.055,span);dot(x+points[i][0],y[row]+points[i][1]+(1-u)*7,u)}
 }
 function descend(parent,child,ids,row,begin){
  ids.forEach((id,i)=>{
   const u=ramp(t,begin+i*.055,2.2);if(u<=0)return;
   const [px,py]=parent[id],[qx,qy]=child[i];
   // Gather at the midpoint of distillation, then settle into the next generation.
   const width=1-.80*Math.sin(Math.PI*u)**2;
   dot(x+(px*(1-u)+qx*u)*width,y[row]*(1-u)+y[row+1]*u+py*(1-u)+qy*u,Math.min(1,5*u),2.1);
  });
 }
 dots(a,0,0,a.length,0,1.1);
 descend(a,b,inherited,0,2.7);dots(b,1,inherited.length,b.length,6.2,1.4);
 descend(b,c,next,1,9.2);dots(c,2,next.length,c.length,12.9,1.2);
}
function animate(){
 cancelAnimationFrame(raf);start=performance.now();
 function step(now){const t=Math.min(end,(now-start)/1000);render(t);if(t<end)raf=requestAnimationFrame(step)}
 raf=requestAnimationFrame(step);
}
language.onclick=()=>{lang=lang==='zh'?'en':'zh';translate();size()};
replay.onclick=animate;translate();size();
new ResizeObserver(size).observe(canvas);
if(matchMedia('(prefers-reduced-motion: reduce)').matches)render(end);else animate();
</script></body></html>
