<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0c0c0c"><title>Inheritance · Born, Not Made</title>
<meta name="description" content="One continuous shot of a lineage. The tail with the arm docks into a head, takes a new part from the water, prints the newborn in gel while the parent's local model is distilled into the newborn's, then pushes the newborn out, inflating. Each newborn keeps part of the parent's model, gathers its own data, and differs in shape, print and parts.">
<style>
*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;background:#0c0c0c;color:#eee;font:14px/1.5 Inter,Arial,sans-serif}
main{max-width:1600px;margin:auto;padding:0 0 6px}
canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;background:#0c0c0c}
footer{display:flex;gap:16px;align-items:center;padding:8px clamp(12px,2.2vw,36px)}
button{color:#bcbcbc;font:inherit;background:none;border:0;padding:4px 0;cursor:pointer}button:hover{color:#fff}
input{flex:1;min-width:20px;accent-color:#ddd}time{color:#9b9a94;font:12px ui-monospace,monospace;white-space:nowrap}
button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:3px}
</style></head><body><main>
<canvas width="1600" height="900" role="img" aria-label="A lineage of robots: print, distill, birth, and learning."></canvas>
<footer aria-label="Playback"><button type="button" id="play">Pause</button><input id="seek" type="range" min="0" max="62" step=".05" value="0" aria-label="Position"><time></time></footer>
</main><script>
/* One shot, one frame. Side view of the simplified bodies (profiles from simulator/simple/simple.json, meters).
   Time is compressed: one print, about two hours, plays in six seconds; the distillation runs in the same window. */
const cv=document.querySelector('canvas'), g=cv.getContext('2d');
const W=1600,H=900,S=700,FLOAT=.14,DOCK=.032;
const TOP=[[-0.43,0.125],[-0.413,0.147],[-0.397,0.167],[-0.38,0.185],[-0.363,0.202],[-0.347,0.218],[-0.33,0.233],[-0.313,0.248],[-0.297,0.261],[-0.28,0.273],[-0.264,0.284],[-0.247,0.294],[-0.23,0.303],[-0.213,0.311],[-0.197,0.318],[-0.18,0.323],[-0.164,0.326],[-0.147,0.329],[-0.13,0.33],[-0.03,0.33],[0.036,0.33],[0.07,0.33],[0.086,0.329],[0.103,0.328],[0.119,0.327],[0.136,0.325],[0.153,0.323],[0.17,0.321],[0.186,0.318],[0.203,0.314],[0.22,0.31],[0.236,0.305],[0.253,0.299],[0.269,0.292],[0.286,0.284],[0.304,0.274]];
const BOT=[[-0.43,0.125],[-0.413,0.083],[-0.397,0.053],[-0.38,0.03],[-0.363,0.014],[-0.347,0.003],[-0.33,0],[0.243,0],[0.249,0.04],[0.253,0.055],[0.256,0.065],[0.263,0.081],[0.269,0.091],[0.276,0.098],[0.283,0.102],[0.296,0.104],[0.366,0.104]];
const LIP=[0.366,0.104];
const topAt=x=>{for(let i=1;i<TOP.length;i++)if(TOP[i][0]>=x){const [a,b]=TOP[i-1],[c,d]=TOP[i];return b+(d-b)*(x-a)/(c-a)}return TOP.at(-1)[1]};
const headTop=TOP.filter(p=>p[0]>=DOCK), headBot=BOT.filter(p=>p[0]>=DOCK);headTop.unshift([DOCK,topAt(DOCK)]);headBot.unshift([DOCK,0]);
const tailTop=TOP.filter(p=>p[0]<=DOCK).concat([[DOCK,.33]]), tailBot=BOT.filter(p=>p[0]<=DOCK).concat([[DOCK,0]]);

const clamp=x=>Math.min(1,Math.max(0,x)), lerp=(a,b,u)=>a+(b-a)*u;
const ease=(t,a,b)=>{const x=clamp((t-a)/(b-a));return x*x*(3-2*x)};
const ink=a=>'rgba(236,235,230,'+clamp(a)+')';
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const shuffle=(a,r)=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* The lineage. Every head is printed, so every head differs a little: proportion, crown, layer pitch, parts. */
const C=18, BIRTHS=3, END=62, N=32, RATE=.3;
const NUM=['I','II','III','IV'];
const TILES=[null,['Sense','a microphone'],['Link','a radio link'],['Display','a small light']];
const robots=[
 {l:1,   h:1,   crown:0,     pitch:.012, kit:['Core','Power','Drive']},
 {l:1.06,h:.93, crown:.014,  pitch:.009, kit:['Core','Power','Drive','Sense']},
 {l:.95, h:1.05,crown:-.012, pitch:.016, kit:['Core','Power','Sense','Link']},
 {l:1.02,h:.97, crown:.02,   pitch:.011, kit:['Core','Power','Drive','Sense','Display']}
];
/* Model cells: 0 empty, 1 inherited (distilled from the parent), 2 learned here. */
robots.forEach((r,i)=>{
  const R=rng(17+i*101);
  r.birth=i?(i-1)*C+13:-30; r.distill=i?(i-1)*C+4.5:null;
  if(!i){r.inh=[];r.own=shuffle([...Array(N).keys()],R);r.own0=9;return}
  const p=robots[i-1], snap=cells(p,r.distill).map((s,k)=>s?k:-1).filter(k=>k>=0);
  r.inh=shuffle(snap,R).slice(0,Math.round(snap.length*.7));
  const empty=[...Array(N).keys()].filter(k=>!r.inh.includes(k));
  r.own=shuffle(empty,R).concat(shuffle(r.inh,R).slice(0,4)); r.own0=0;
});
function cells(r,t){
  const s=new Array(N).fill(0);
  r.inh.forEach((k,j)=>{if(t>=r.distill+6*(j+1)/(r.inh.length+1)+.8)s[k]=1});
  const n=Math.min(r.own.length,r.own0+Math.max(0,Math.floor(RATE*(t-Math.max(0,r.birth)))));
  if(r.birth<=t||!r.distill)for(let j=0;j<n;j++)s[r.own[j]]=2;
  return s;
}
const count=(r,t)=>{const s=cells(r,t);return [s.filter(v=>v===1).length,s.filter(v=>v===2).length]};

/* Poses. A head pose: X0 = screen x of the back face, Yb = screen y of the body floor, sc = depth scale, mx/mz = fold. */
const FG_W=520, FG_YB=FG_W+FLOAT*S, BG_W=215, BG_SC=.42, BG_YB=BG_W+FLOAT*S*BG_SC;
const DOCKX=720, FREEX=1150;
const bgSlot=i=>({X0:170+i*215-.167*S*BG_SC,Yb:BG_YB,sc:BG_SC,mx:1,mz:1,a:.62});
const fgPose=X=>({X0:X,Yb:FG_YB,sc:1,mx:1,mz:1,a:1});
const mix=(p,q,u)=>({X0:lerp(p.X0,q.X0,u),Yb:lerp(p.Yb,q.Yb,u),sc:lerp(p.sc,q.sc,u),mx:lerp(p.mx,q.mx,u),mz:lerp(p.mz,q.mz,u),a:lerp(p.a,q.a,u)});
function hx(r,p,x){return p.X0+(x-DOCK)*r.l*S*p.sc*p.mx}
function hz(r,p,x,z){const c=r.crown*Math.sin(Math.PI*clamp((x-DOCK)/.3))*(z>.2?1:0);return p.Yb-(z*r.h+c)*S*p.sc*p.mz}

function headPath(r,p){
  const P=new Path2D();
  headTop.forEach(([x,z],i)=>{i?P.lineTo(hx(r,p,x),hz(r,p,x,z)):P.moveTo(hx(r,p,x),hz(r,p,x,z))});
  P.lineTo(hx(r,p,LIP[0]),hz(r,p,LIP[0],LIP[1]));
  for(let i=headBot.length-1;i>=0;i--){const [x,z]=headBot[i];P.lineTo(hx(r,p,x),hz(r,p,x,z))}
  P.closePath();return P;
}
function drawHead(r,p,t,opts={}){
  const P=headPath(r,p);
  g.save();g.globalAlpha*=p.a;
  g.fillStyle=ink(.055);g.fill(P);
  g.save();g.clip(P);
  // Print layers: the pitch is this body's own.
  const step=r.pitch*S*p.sc*p.mz*r.h, y0=p.Yb, y1=hz(r,p,.15,.34);
  g.strokeStyle=ink(.13);g.lineWidth=.8;g.beginPath();
  for(let y=y0-step;y>y1;y-=step){g.moveTo(p.X0-5,y);g.lineTo(hx(r,p,.4)+5,y)}
  g.stroke();
  if(opts.wrinkle>0){ // folded skin before it inflates
    g.strokeStyle=ink(.5*opts.wrinkle);g.lineWidth=1;g.beginPath();
    for(let k=1;k<9;k++){const x=hx(r,p,DOCK+k*.037);g.moveTo(x,p.Yb);for(let j=1;j<=6;j++)g.lineTo(x+(j%2?3:-3)*p.sc,p.Yb-j*.055*S*p.sc*p.mz)}
    g.stroke();
  }
  // Parts sealed in the wall, the newest outlined.
  const ks=.017*S*p.sc*Math.min(p.mx,1);
  r.kit.forEach((k,i)=>{
    if(opts.kitUpTo!==undefined&&i>=opts.kitUpTo)return;
    const x=hx(r,p,.07)+i*(ks+3*p.sc), y=p.Yb-.25*S*p.sc*p.mz*r.h-ks/2;
    g.fillStyle=ink(.62);g.fillRect(x,y,ks,ks);
  });
  g.restore();
  g.strokeStyle=ink(.78);g.lineWidth=1.5*Math.max(.6,p.sc);g.stroke(P);
  // the mouth, an opening
  g.strokeStyle='#0c0c0c';g.lineWidth=2.4*Math.max(.6,p.sc);g.beginPath();
  g.moveTo(lerp(hx(r,p,.304),hx(r,p,LIP[0]),.12),lerp(hz(r,p,.304,.274),hz(r,p,LIP[0],LIP[1]),.12));
  g.lineTo(lerp(hx(r,p,.304),hx(r,p,LIP[0]),.88),lerp(hz(r,p,.304,.274),hz(r,p,LIP[0],LIP[1]),.88));g.stroke();
  g.restore();
}
function drawTail(Xd,Yb){
  const P=new Path2D(),tx=x=>Xd+(x-DOCK)*S,tz=z=>Yb-z*S;
  tailTop.forEach(([x,z],i)=>i?P.lineTo(tx(x),tz(z)):P.moveTo(tx(x),tz(z)));
  for(let i=tailBot.length-1;i>=0;i--)P.lineTo(tx(tailBot[i][0]),tz(tailBot[i][1]));
  P.closePath();
  g.fillStyle=ink(.035);g.fill(P);g.strokeStyle=ink(.55);g.lineWidth=1.3;g.stroke(P);
  return {base:[tx(-.115),tz(.2)],floor:[tx(-.115),tz(.005)],roof:tz(.3),front:tx(DOCK),docked:Xd>=DOCKX-1};
}
function drawArm(tail,tip){
  const [bx,by]=tail.base,L=.26*S;
  let dx=tip[0]-bx,dy=tip[1]-by,d=Math.hypot(dx,dy);
  if(d>2*L-1){tip=[bx+dx/d*(2*L-1),by+dy/d*(2*L-1)];dx=tip[0]-bx;dy=tip[1]-by;d=2*L-1}
  const a=Math.atan2(dy,dx), b=Math.acos(clamp(d/(2*L)));
  // elbow up, kept under the roof and, when the tail is alone, inside the tail
  const ex=Math.min(bx+L*Math.cos(a-b),tail.docked?1e9:tail.front-10), ey=Math.max(by+L*Math.sin(a-b),tail.roof);
  g.strokeStyle=ink(.7);g.lineWidth=2;g.beginPath();
  g.moveTo(...tail.floor);g.lineTo(bx,by);g.lineTo(ex,ey);g.lineTo(...tip);g.stroke();
  g.fillStyle=ink(.85);g.beginPath();g.arc(tip[0],tip[1],2.6,0,7);g.fill();
  return tip;
}
function gridGeom(r,p){
  const cs=Math.max(4.5,10*p.sc), gap=cs*.4, w=8*cs+7*gap;
  const cx=hx(r,p,.18), y=hz(r,p,.18,.33)-24*p.sc-4*cs-3*gap;
  return {cs,gap,x:cx-w/2,y,w};
}
const cellXY=(G,k)=>[G.x+(k%8)*(G.cs+G.gap)+G.cs/2,G.y+Math.floor(k/8)*(G.cs+G.gap)+G.cs/2];
function drawGrid(G,s,a=1){
  g.save();g.globalAlpha*=a;
  s.forEach((v,k)=>{
    const [x,y]=cellXY(G,k),h=G.cs/2;
    if(v===0){g.strokeStyle=ink(.2);g.lineWidth=1;g.strokeRect(x-h+.5,y-h+.5,G.cs-1,G.cs-1)}
    else{g.fillStyle=v===1?'#7b7b77':'#ecebe6';g.fillRect(x-h,y-h,G.cs,G.cs)}
  });
  g.restore();
}
function text(s,x,y,size,a,font='Arial',align='left',track=0){
  g.save();g.textAlign=align;g.fillStyle=ink(a);g.font=size+'px '+font;
  if(track&&'letterSpacing' in g)g.letterSpacing=track+'px';g.fillText(s,x,y);g.restore();
}
const mono='ui-monospace, "JetBrains Mono", Menlo, monospace';
function ledger(r,i,p,t,a=1){
  const [ni,no]=count(r,t), cx=hx(r,p,.2), y=p.Yb+(p.sc>.6?40:26);
  g.save();g.globalAlpha*=a*p.a;
  text(NUM[i],cx,y,Math.round(26*Math.max(.62,p.sc)),.92,'Georgia','center');
  text(ni+' inherited · '+no+' own',cx,y+(p.sc>.6?24:17),Math.round(13*Math.max(.8,p.sc)),.75,mono,'center');
  text(r.kit.join(' ').toUpperCase(),cx,y+(p.sc>.6?43:31),Math.round(10*Math.max(.85,p.sc)),.5,mono,'center',1.2);
  g.restore();
}
const hms=s=>{s=Math.round(s);return Math.floor(s/3600)+':'+String(Math.floor(s/60)%60).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const PRINT=6815, DISTILL=6480; // print time from simple.json; distillation set to land just before the print ends

function frame(t){
  g.setTransform(cv.width/W,0,0,cv.height/H,0,0);
  g.fillStyle='#0c0c0c';g.fillRect(0,0,W,H);
  // far and near water lines
  g.strokeStyle=ink(.08);g.lineWidth=1;g.beginPath();g.moveTo(0,BG_W);g.lineTo(W,BG_W);g.stroke();
  g.strokeStyle=ink(.22);g.beginPath();for(let x=0;x<=W;x+=10){const y=FG_W+1.6*Math.sin(x*.012+t*.8);x?g.lineTo(x,y):g.moveTo(x,y)}g.stroke();
  g.fillStyle='rgba(255,255,255,.018)';g.fillRect(0,FG_W,W,H-FG_W);

  const cyc=Math.min(BIRTHS-1,Math.floor(t/C)), done=t>=BIRTHS*C, u=t-cyc*C; // u: time inside the cycle
  const par=robots[cyc], kid=robots[cyc+1];
  let phase, caption;

  // tail position
  let Xd;
  if(cyc===0&&u<2)Xd=lerp(560,DOCKX,ease(u,0,2));
  else if(u<2)Xd=lerp(DOCKX-60,DOCKX,ease(u,0,2));
  else if(u<13)Xd=DOCKX;
  else Xd=lerp(DOCKX,DOCKX-60,ease(u,13,15));
  if(done)Xd=DOCKX-60;

  // elders in the far line
  for(let i=0;i<robots.length;i++){
    const r=robots[i];
    const gone=(i<cyc)||(done&&i<BIRTHS);
    if(!gone)continue;
    const p=bgSlot(i);drawHead(r,p,t);drawGrid(gridGeom(r,p),cells(r,t),.8);ledger(r,i,p,t);
  }
  // the parent of this cycle
  let pp=fgPose(DOCKX);
  if(!done&&u>15)pp=mix(fgPose(DOCKX),bgSlot(cyc),ease(u,15,18));
  if(!done){drawHead(par,pp,t);}
  const tail=drawTail(Xd,FG_YB);
  // the newborn
  let kp=null, wr=0, kitUpTo, printU=0;
  if(!done&&u>=4.5){
    const at=(x,z)=>[hx(par,fgPose(DOCKX),x),fgPose(DOCKX).Yb-z*par.h*S];
    const fold={mx:.45,mz:.27};
    if(u<10.5){ // printing inside the parent, in gel
      printU=clamp((u-4.5)/6);
      const [X0,Yb]=at(.075,.004);kp={X0,Yb,sc:1,...fold,a:1};wr=1;
    }else if(u<13){
      const v=clamp((u-10.5)/2.5), lift=.11*Math.sin(Math.PI*v);
      const [X0,Yb]=at(lerp(.075,.40,v),.004+lift);const inf=ease(v,.3,1);
      kp={X0,Yb,sc:1,mx:lerp(.45,1,inf),mz:lerp(.27,1,inf),a:1};wr=1-inf;
    }else{
      const [X0,Yb]=at(.40,.004), from={X0,Yb,sc:1,mx:1,mz:1,a:1};
      kp=mix(from,fgPose(FREEX),ease(u,13,15));
      if(u>15)kp=mix(fgPose(FREEX),fgPose(DOCKX),ease(u,15,18));
    }
  }
  if(done)kp=fgPose(DOCKX);
  const child=done?robots[BIRTHS]:kid, ci=done?BIRTHS:cyc+1;
  if(kp){
    if(!done&&u<10.5){ // grow layer by layer
      g.save();const top=kp.Yb-.09*S*printU;g.beginPath();g.rect(0,top,W,H);g.clip();
      drawHead(child,kp,t,{wrinkle:wr});g.restore();
      g.strokeStyle=ink(.55);g.lineWidth=1;g.beginPath();g.moveTo(hx(child,kp,DOCK),top);g.lineTo(hx(child,kp,.366),top);g.stroke();
    }else drawHead(child,kp,t,{wrinkle:wr});
  }

  // the arm
  const rest=[tail.base[0]+.1*S,tail.base[1]+.08*S];
  let tip=rest, tile=null;
  if(!done&&TILES[cyc+1]){
    const T=TILES[cyc+1], seat=[hx(par,fgPose(DOCKX),.2),FG_YB-.04*S];
    const water=[hx(par,fgPose(DOCKX),.41)+4*Math.sin(t),FG_W-5];
    let tp=[lerp(1660,water[0],ease(u,-1+C*(cyc>0?0:0),2.4)),water[1]+2*Math.sin(t*1.3)];
    if(cyc===0&&u<2.4)tp[0]=lerp(1660,water[0],ease(u,0,2.4));
    if(u<2){tip=rest}
    else if(u<3.1){tip=[lerp(rest[0],tp[0],ease(u,2,3.1)),lerp(rest[1],tp[1],ease(u,2,3.1))]}
    else if(u<4.5){tip=[lerp(tp[0],seat[0],ease(u,3.3,4.4)),lerp(tp[1],seat[1],ease(u,3.3,4.4))];tp=tip}
    if(u<4.4)tile={p:tp,name:T[0]};
    if(u>=4.5&&u<10.5){const k=printU*28;tip=[hx(child,kp,.06+.22*Math.abs((k%2)-1)),kp.Yb-.09*S*printU]}
    if(u>=10.5&&u<12.6){const v=clamp((u-10.5)/2.1);tip=v<.55?[hx(child,kp,DOCK)-4,kp.Yb-.05*S*kp.mz]:[lerp(hx(child,kp,DOCK)-4,rest[0],ease(v,.55,1)),lerp(kp.Yb-.05*S*kp.mz,rest[1],ease(v,.55,1))]}
  }
  const armTip=drawArm(tail,tip);
  if(tile){
    const [x,y]=tile.p;g.fillStyle=ink(.85);g.fillRect(x-7,y-7,14,14);
    text(tile.name.toUpperCase(),x,y-16,10.5,.8,mono,'center',1.4);
  }

  // models: the parent's, and the newborn's while it is being distilled
  if(!done){
    const pa=u>15?1-ease(u,15,16):1;
    drawGrid(gridGeom(par,pp),cells(par,t),pa);
    if(u<15)ledger(par,cyc,pp,t);
    if(kp&&u>=4.5){
      let G;
      if(u<13){const pg=gridGeom(par,fgPose(DOCKX));G={...pg,x:pg.x+pg.w+60};}
      else G=gridGeom(child,kp);
      if(u>13&&u<15){const pg=gridGeom(par,fgPose(DOCKX)),from={...pg,x:pg.x+pg.w+60},v=ease(u,13,15);G={...G,x:lerp(from.x,G.x,v),y:lerp(from.y,G.y,v)}}
      drawGrid(G,cells(child,t));
      if(u<13)text(NUM[cyc+1],G.x+G.w+14,G.y+G.cs*1.4,20,.85,'Georgia');
      // what crosses over: a compressed part of the parent, never the whole
      if(u<11){
        const PG=gridGeom(par,fgPose(DOCKX));
        child.inh.forEach((k,j)=>{
          const t1=child.distill+6*(j+1)/(child.inh.length+1), v=(t-t1)/.8;
          if(v<0||v>1)return;
          const [ax,ay]=cellXY(PG,k),[bx,by]=cellXY(G,k),e=v*v*(3-2*v);
          const x=lerp(ax,bx,e),y=lerp(ay,by,e)-40*Math.sin(Math.PI*e);
          g.fillStyle=ink(.9*Math.sin(Math.PI*v)+.1);g.fillRect(x-3,y-3,6,6);
        });
      }
      if(u>=13)ledger(child,cyc+1,kp,t,ease(u,13,14));
    }
  }else{drawGrid(gridGeom(child,kp),cells(child,t));ledger(child,ci,kp,t)}

  // the two clocks: print and distillation, in the same two hours
  if(!done&&u>=4.5&&u<15){
    const a=u<10.5?1:1-ease(u,13,15), v=printU||1, x=64, y=732;
    const row=(name,sec,total,yy)=>{
      text(name,x,yy,12,.6*a,mono,'left',1.4);
      text(hms(Math.min(sec,total))+(sec>=total?'  done':''),x+110,yy,13,.92*a,mono);
      g.fillStyle=ink(.15*a);g.fillRect(x+250,yy-5,200,1);g.fillStyle=ink(.8*a);g.fillRect(x+250,yy-5.5,200*Math.min(1,sec/total),2);
      text(hms(total),x+462,yy,12,.5*a,mono);
    };
    row('PRINT',v*PRINT,PRINT,y);row('DISTILL',v*PRINT,DISTILL,y+24);
  }

  // legend
  const lg=(x,fill,label)=>{if(fill)g.fillStyle=fill,g.fillRect(x,40,10,10);else{g.strokeStyle=ink(.3);g.strokeRect(x+.5,40.5,9,9)}text(label,x+16,49,11,.6,mono,'left',1)};
  lg(64,'#7b7b77','INHERITED');lg(184,'#ecebe6','LEARNED HERE');lg(328,null,'EMPTY');
  text('Local model, one cell per learned pattern',1536,49,12,.45,mono,'right');

  // caption
  if(done){phase='Lineage';caption='Inherited in the model. Different in body, parts and data.'}
  else if(u<2){phase='Dock';caption=cyc?'The tail moves to the newborn and docks from behind. Only the head is born.':'The tail docks from behind. The tail and its arm pass from head to head.'}
  else if(u<4.5){phase='A new part';caption='The arm takes '+TILES[cyc+1][1]+' from the water. The parent never had one.'}
  else if(u<10.5){phase='Print and distill';caption='The body is printed in gel while the parent’s local model is distilled into the newborn’s.'}
  else if(u<13){phase='Birth';caption='Pushed out through the mouth, inflating on the way, full size as it leaves.'}
  else if(u<15){phase='A different body';caption='Printed, not cast: shape, layers and parts all differ from the parent’s.'}
  else{phase='Own data';caption='The newborn starts learning from what it meets. The parent stays, and keeps learning.'}
  text(phase.toUpperCase(),64,808,12,.55,mono,'left',1.6);
  g.save();g.font='34px Georgia';const w=g.measureText(caption).width;g.restore();
  text(caption,64,852,Math.min(34,34*1470/w),.97,'Georgia');
  return phase+'. '+caption;
}

const play=document.getElementById('play'),seek=document.getElementById('seek'),clock=document.querySelector('time');
let t=0,run=!matchMedia('(prefers-reduced-motion: reduce)').matches,last=performance.now();
const lab=s=>Math.floor(s/60)+':'+String(Math.floor(s)%60).padStart(2,'0');
function size(){const r=Math.min(2,devicePixelRatio||1),w=Math.round(cv.clientWidth*r);if(w&&cv.width!==w){cv.width=w;cv.height=Math.round(w*9/16)}}
function show(){size();const d=frame(t);if(cv.getAttribute('aria-label')!==d)cv.setAttribute('aria-label',d);seek.value=t;clock.textContent=lab(t)+' / '+lab(END);play.textContent=run?'Pause':'Play'}
function tick(now){if(run){t+=(now-last)/1000;if(t>=END)t=0}last=now;show();requestAnimationFrame(tick)}
play.onclick=()=>{run=!run;last=performance.now();show()};
seek.oninput=()=>{t=+seek.value;run=false;show()};
document.addEventListener('visibilitychange',()=>{last=performance.now()});
const q=new URLSearchParams(location.search).get('t');if(q!==null&&isFinite(+q)){t=+q;run=false}
requestAnimationFrame(tick);
</script></body></html>
