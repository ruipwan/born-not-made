<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inheritance · Born, Not Made</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101010;color:#eee;font:16px/1.55 Inter,Arial,"Microsoft YaHei",sans-serif}
main{width:min(880px,100%);margin:auto;padding:clamp(24px,6vw,66px) clamp(22px,5vw,58px)}
header,footer{display:flex;align-items:center;justify-content:space-between}a,button{color:#bbb;font:inherit;font-size:14px}a{text-decoration:none}button{background:none;border:0;padding:8px 0;cursor:pointer}a:hover,button:hover{color:white}h1{font:normal clamp(36px,6vw,60px)/1.2 Georgia,"Songti SC",SimSun,serif;margin:40px 0 36px}
ol{list-style:none;padding:0;margin:0}
li{display:grid;grid-template-columns:minmax(5em,8em) 1fr;align-items:baseline;column-gap:16px}
.gen{font-weight:600}.words{margin:0}.via{margin:14px 0 14px 1em;color:#aaa;font-size:14px;display:flex;align-items:center;gap:9px}.via::before{content:"↓";font-size:24px;font-weight:300}
.draw li{animation:appear .65s ease-out backwards}.draw li:nth-child(2){animation-delay:.6s}.draw li:nth-child(3){animation-delay:1.2s}.draw li:nth-child(4){animation-delay:1.8s}.draw li:nth-child(5){animation-delay:2.4s}
@keyframes appear{from{opacity:0}to{opacity:1}}footer{margin-top:36px}
@media(max-width:540px){li{grid-template-columns:4.5em 1fr;column-gap:8px}}
@media(prefers-reduced-motion:reduce){.draw li{animation:none}}
</style></head>
<body><main>
<header><a href="../#inheritance" target="_top">Born, Not Made</a><button id="lang" type="button">English</button></header>
<h1 id="title">记忆的继承</h1>
<ol id="lineage">
<li><span class="gen">第一代</span><p class="words">与人互动，形成记忆。</p></li>
<li class="via">模型蒸馏</li>
<li><span class="gen">第二代</span><p class="words">继承上一代的部分记忆，在新的互动中积累自己的记忆。</p></li>
<li class="via">模型蒸馏</li>
<li><span class="gen">第三代</span><p class="words">继承第二代留下的记忆，继续成长。</p></li>
</ol>
<footer><button id="replay" type="button">重播</button></footer>
</main><script>
const lineage=document.getElementById('lineage');
const language=document.getElementById('lang');
const replay=document.getElementById('replay');
const title=document.getElementById('title');
const generations=[["第一代","与人互动，形成记忆。","Generation 1","Encounters with people become memories."],["第二代","继承上一代的部分记忆，在新的互动中积累自己的记忆。","Generation 2","Inherits part of the first generation’s memory and forms memories of its own."],["第三代","继承第二代留下的记忆，继续成长。","Generation 3","Inherits memory from the second generation and continues to grow."]];
const words=lineage.querySelectorAll('.words');
let lang=new URLSearchParams(location.search).get('lang')==='zh'?'zh':'en';
function translate(){
 const zh=lang==='zh';document.documentElement.lang=lang;title.textContent=zh?'记忆的继承':'Memory inheritance';
 words.forEach((el,i)=>{el.previousElementSibling.textContent=generations[i][zh?0:2];el.textContent=generations[i][zh?1:3]});
 lineage.querySelectorAll('.via').forEach(el=>el.textContent=zh?'模型蒸馏':'Model distillation');
 replay.textContent=zh?'重播':'Replay';language.textContent=zh?'English':'中文';
}
function animate(){lineage.classList.remove('draw');void lineage.offsetWidth;lineage.classList.add('draw')}
language.onclick=()=>{lang=lang==='zh'?'en':'zh';translate()};
replay.onclick=animate;translate();animate();
</script></body></html>
