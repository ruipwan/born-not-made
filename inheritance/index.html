*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;background:#0c0c0c;color:#eee;font:15px/1.5 Inter,Arial,sans-serif}main{max-width:1400px;margin:auto;padding:18px clamp(12px,3vw,44px)}header,footer{display:flex;align-items:center;gap:20px}header{justify-content:space-between;padding:0 0 14px}a,button{color:inherit;font:inherit}a{text-underline-offset:4px}header a{text-decoration:none}header span,time{font-size:13px;color:#aaa}canvas{width:100%;display:block;aspect-ratio:16/9;background:#090909}footer{padding:13px 0;gap:14px}button{background:transparent;border:0;padding:5px 0;cursor:pointer}input{accent-color:#ddd;min-width:32px;flex:1}time{font-variant-numeric:tabular-nums;white-space:nowrap}.mobile{display:none}footer a{font-size:13px}@media(max-width:600px){main{padding:12px}.mobile{display:block;min-height:3.2em;margin:12px 0 0;font:19px Georgia,serif}footer{gap:9px;font-size:13px}time{display:none}}@media(min-width:601px){main{padding-bottom:0}}
</style></head><body><main><header><a href="../#inheritance" target="_top">Born, Not Made</a><span>Inheritance</span></header><canvas width="1600" height="900" aria-label="An animated cutaway of three generations of egg-shaped robots carrying independent Raspberry Pi 5 computers"></canvas><p class="mobile"></p><footer><button id="play">Pause</button><input id="seek" type="range" min="0" max="34" step=".05" value="0" aria-label="Film position"><time></time><button id="again">Replay</button><a href="inheritance.mp4?v=egg" download>MP4</a></footer></main>
<script>
const cv=document.querySelector('canvas'), g=cv.getContext('2d');
const tau=Math.PI*2, duration=34;
const clamp=x=>Math.min(1,Math.max(0,x));
function ease(t,a,b){let x=clamp((t-a)/(b-a));return x*x*(3-2*x)}
function lerp(a,b,u){return a+(b-a)*u}
function ink(a){return 'rgba(234,234,232,'+clamp(a)+')'}
function path(d,fill,stroke,w=1){const p=new Path2D(d);if(fill){g.fillStyle=fill;g.fill(p)}if(stroke){g.lineWidth=w;g.strokeStyle=stroke;g.stroke(p)}}
function ellipse(x,y,rx,ry,color,stroke,w=1){g.beginPath();g.ellipse(x,y,rx,ry,0,0,tau);if(color){g.fillStyle=color;g.fill()}if(stroke){g.lineWidth=w;g.strokeStyle=stroke;g.stroke()}}
function label(s,x,y,size=17,color='#bbb',face='Arial'){g.fillStyle=color;g.font=size+'px '+face;g.fillText(s,x,y)}
function rect(x,y,w,h,fill){g.fillStyle=fill;g.fillRect(x,y,w,h)}
function gradient(x,y,x1,y1,stops){let p=g.createLinearGradient(x,y,x1,y1);for(const [at,color] of stops)p.addColorStop(at,color);return p}
function board(){
 // Diagrammatic component placement. Keep the connector edge, processor, and GPIO header distinct.
 g.save();g.rotate(-.07);g.transform(1,0,-.13,.85,0,0);
 path('M-50 -32 H47 Q51 -32 51 -28 V29 Q51 32 47 32 H-48 Q-52 32 -52 28 V-28 Q-52 -32 -50 -32Z','#292929','#a3a3a1',1.2);
 for(let k=0;k<20;k++)for(let j=0;j<2;j++)rect(-43+3.05*k,-28+3.7*j,1.9,2.1,'#cdcdca');
 for(const [x,y] of [[-47,-27],[44,-27],[-47,26],[44,26]])ellipse(x,y,2.3,2.3,'#111','#aaa',.8);
 for(let i=0;i<9;i++)path('M-5 '+(4+i*1.7)+' h9 l5 4 h9',null,'#555',.6);
 rect(-19,-14,22,23,'#a9a9a5');rect(-17,-12,18,19,'#777773');rect(-34,-11,11,18,'#090909');rect(6,3,16,14,'#111');
 for(const [y,h] of [[-25,13],[-9,13],[9,17]]){rect(30,y,23,h,'#a6a6a2');rect(33,y+2,18,h-4,'#626260');rect(49,y+2,4,h-4,'#252525')}
 for(const x of [-38,-17,0]){rect(x,26,11,6,'#a4a4a2');rect(x+2,29,7,3,'#414141')}
 g.restore();
}
function memory(seed,count,alpha,add=0){
 for(let i=0;i<count;i++){const a=i*2.39996+seed,r=5.5*Math.sqrt(i+.3);let x=Math.cos(a)*r,y=Math.sin(a)*r*.64;
 if(i>=12){x+=add;y-=6}
 ellipse(x,y,1.65+(i%3)*.35,1.65+(i%3)*.35,ink(alpha*(.55+(i%4)*.13)));
 }
}
const shell='M 157 -46 C 119 -103 36 -121 -45 -108 C -132 -94 -194 -36 -207 4 C -197 32 -143 74 -83 96 C -4 126 110 98 157 45 C 170 29 170 -25 157 -46Z';
function body(t,x,y,scale,rot,kind,opening,mem,alpha=1){
 g.save();g.translate(x,y);g.rotate(rot);g.scale(scale,scale);g.globalAlpha*=alpha;
 const wet=gradient(0,-115,8,114,[[0,'#888884'],[.055,'#777774'],[.10,'#353535'],[.28,'#252525'],[.48,'#141414'],[.78,'#252525'],[.93,'#434342'],[1,'#949490']]);
 path(shell,wet,ink(.68),1.6);
 g.save();g.clip(new Path2D(shell));
 // Longitudinal seams and thin optical highlights describe the transparent wall.
 for(let j=0;j<5;j++)path('M-208 '+(11+j*2)+' Q-135 '+(-88+j*3)+' -41 '+(-102+j*3)+' Q70 '+(-130+j*3)+' 151 '+(-49+j*2),null,ink(.28-j*.045),1.2);
 for(let j=0;j<5;j++)path('M-182 '+(29+j*2)+' Q-40 '+(156-j*3)+' 157 '+(44-j*2),null,ink(.21-j*.029),1.05);
 for(let j=0;j<8;j++){const u=j/7,xx=lerp(-100,105,u);path('M'+xx+' '+(-87-14*Math.sin(u*Math.PI))+' Q'+(xx+24)+' -10 '+(xx-6)+' '+(85+14*Math.sin(u*Math.PI)),null,ink(kind? .115:.065),1)}
 path('M-99 36 Q-47 60 0 40 L24 28',null,ink(.3),2);
 g.save();g.translate(-60,0);board();g.restore();
 g.save();g.translate(4,-52);memory(.3,Math.round(mem),.96,kind?3:0);g.restore();
 // Recessed front chamber remains visible through the near wall.
 ellipse(70,6,58,47,'rgba(5,5,5,.38)',ink(.23),1);
 path('M20 33 Q70 56 134 23',null,ink(.21),1.1);
 g.restore();
 const lift=opening*20;
 ellipse(151,0,14,43+lift,'#171717',ink(.35),2);
 path('M136 -46 Q148 '+(-41-lift)+' 161 '+(-36-lift),null,ink(.83),3);
 path('M135 46 Q148 '+(43+lift)+' 160 '+(35+lift),null,ink(.75),2.4);
 g.restore();
}
const stars=Array.from({length:62},(_,i)=>[(i*349.33)%1640,(i*163.81)%560+38,((i*37)%10)/10]);
function water(t){
 rect(0,0,1600,900,'#0b0b0b');
 const glow=g.createRadialGradient(850,283,15,850,283,815);glow.addColorStop(0,'#222222');glow.addColorStop(.5,'#141414');glow.addColorStop(1,'#0b0b0b');rect(0,0,1600,692,glow);
 for(const [x,y,z] of stars)ellipse((x+t*(.5+z))%1630-12,y+3*Math.sin(t*.30+z*8),.6+z,.6+z,ink(.08+z*.17));
 for(let j=0;j<6;j++){g.beginPath();for(let x=0;x<=1600;x+=8){const y=104+j*4+9*Math.sin(x*.004+t*.13)+4*Math.sin(x*.016+j*.2+t*.2);if(x)g.lineTo(x,y);else g.moveTo(x,y)}g.strokeStyle=ink(.05-j*.005);g.lineWidth=.8;g.stroke()}
}
const shots=[
 [0,'Memory','Encounters leave a memory in the first robot.'],
 [5,'Distillation','Part of that memory takes shape in a new model.'],
 [11,'Birth','The second robot slips free, carrying its own model.'],
 [17,'Experience','A new encounter changes what the second robot carries.'],
 [23,'Inheritance','Its inherited and acquired memories shape the next generation.'],
 [28,'Birth','A third robot enters the water.']
];
function callout(text,x,y,offset,opacity){
 if(opacity<.01)return;g.save();g.globalAlpha*=opacity;
 const endX=x-82,endY=y+offset;
 path('M'+x+' '+y+' L'+(x-32)+' '+endY+' H'+(endX-120),null,ink(.55),1.2);
 label(text,endX-120,endY+24,18,'#d4d4d2');g.restore();
}
function seeds(t,a,b,u,alpha){
 if(alpha<.01)return;
 for(let i=0;i<10;i++){const v=(u+i*.096)%1,spread=Math.sin(v*Math.PI);ellipse(lerp(a[0],b[0],v),lerp(a[1],b[1],v)+spread*(9*Math.sin(3*i)-15),1.5,1.5,ink(alpha*spread))}
}
function frame(t){
 const k=Math.max(0,shots.findLastIndex(s=>t>=s[0])), shot=shots[k];water(t);
 const zoom=ease(t,1,5)*(1-ease(t,12,18)),follow=ease(t,14,20),wide=ease(t,23,30);
 const ax=670+60*zoom-399*follow-15*wide,ay=360+5*Math.sin(t*.54),as=1.32+.49*zoom-.41*follow-.10*wide;
 const rot=-.04+.019*Math.sin(t*.71);
 const bOut=ease(t,11,16),bRise=ease(t,15,20);
 const bx=ax+as*lerp(73,300,bOut)+follow*181,by=ay-6+rot*(bx-ax)-26*bRise+6*Math.sin(t*.70)*bOut;
 const bs=(.21+.10*zoom)*(1-bRise)+(.90-.06*wide)*bRise;
 const br=lerp(rot,-.15+.046*Math.sin(t*.88),bOut);
 const bop=ease(t,4.9,8.4),co=ease(t,22.4,25.5),cOut=ease(t,27,32);
 const cx=bx+Math.cos(br)*bs*lerp(64,350,cOut)+cOut*56,cy=by+Math.sin(br)*bs*lerp(64,350,cOut)+cOut*(38+7*Math.sin(t*.8));
 const cs=.175+.47*ease(t,29,33.2);
 const ambient=ease(t,17,19)*(1-ease(t,21,23));
 if(ambient)body(t,lerp(1510,1060,ease(t,16,20))+110*ease(t,20,24),by-130+11*Math.sin(t*.5),.34,.16,1,0,9,.52*ambient);
 body(t,ax,ay,as,rot,0,ease(t,9,12)*(1-ease(t,14,16)),4+14*ease(t,.4,4.5));
 if(bop)body(t,bx,by,bs,br,1,ease(t,25.5,27.8)*(1-ease(t,30,32)),4+8*ease(t,6,10)+8*ease(t,18.5,22.2),bop);
 if(co)body(t,cx,cy,cs,.03+.07*Math.sin(t*.68)*cOut,2,0,3+12*ease(t,23.5,27),co);
 seeds(t,[ax,ay-53*as],[bx,by-8],t*.34,ease(t,5,6)*(1-ease(t,10,11)));
 seeds(t,[bx,by-48*bs],[cx,cy-6],t*.34,ease(t,22.8,24)*(1-ease(t,26.5,27.6)));
 seeds(t,[bx+243,by-102],[bx+8,by-42],t*.25,ambient*.85);
 callout('Raspberry Pi 5  /  8 GB',ax-62*as,ay+13*as,115,ease(t,.3,1.4)*(1-ease(t,4.6,5.7)));
 callout('Independent local model',bx-38*bs,by+19*bs,100,ease(t,15.4,16.3)*(1-ease(t,17.8,18.8)));
 if(t>30){const alpha=ease(t,30,31.7);for(const [name,x,y,s] of [['I',ax,ay,as],['II',bx,by,bs],['III',cx,cy,cs]]){g.save();g.textAlign='center';label(name,x,y+121*s+20,20,ink(alpha*.85),'Georgia');g.restore()}}
 label('BORN, NOT MADE',75,62,16,'#a7a7a5');g.save();g.textAlign='right';label('Inheritance',1526,62,20,'#ccc','Georgia');g.restore();
 g.save();g.globalAlpha=.52+.48*ease(t,shot[0],shot[0]+.8);label(shot[1].toUpperCase(),77,745,18,'#aaa');label(shot[2],74,807,38,'#e3e3df','Georgia');g.restore();
 document.querySelector('.mobile').textContent=shot[2];
}
let t=0,run=false,last=0,id=0;
const play=document.getElementById('play'),seek=document.getElementById('seek'),clock=document.querySelector('time');
function show(){frame(t);seek.value=t;clock.textContent='0:'+String(Math.floor(t)).padStart(2,'0')+' / 0:34';play.textContent=run?'Pause':t>=duration?'Replay':'Play'}
function tick(now){if(!run)return;t=Math.min(duration,t+(now-last)/1000);last=now;if(t>=duration)run=false;show();if(run)id=requestAnimationFrame(tick)}
function start(){cancelAnimationFrame(id);run=true;last=performance.now();show();id=requestAnimationFrame(tick)}
function pause(){run=false;cancelAnimationFrame(id);show()}
play.onclick=()=>{if(run)pause();else{if(t>=duration)t=0;start()}};document.getElementById('again').onclick=()=>{t=0;start()};
seek.oninput=()=>{t=Number(seek.value);pause()};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&run)pause()});
if(matchMedia('(prefers-reduced-motion: reduce)').matches){t=32.5;show()}else start();
</script></body></html>
