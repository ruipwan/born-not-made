<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0c0c0c"><title>Inheritance · Born, Not Made</title>
<meta name="description" content="One continuous shot of a lineage. The tail with the arm docks into a head, takes a new part from the water, prints the newborn in gel while the parent's local model is distilled into the newborn's, then pushes the newborn out, inflating. Each newborn keeps part of the parent's model, gathers its own data, and differs in shape, print and parts.">
<style>
*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;background:#0c0c0c;color:#eee;font:14px/1.5 Inter,Arial,sans-serif}
main{max-width:1600px;margin:auto;padding:0 0 6px}
canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;background:#0c0c0c}
footer{display:flex;gap:16px;align-items:center;padding:8px clamp(12px,2.2vw,36px)}
button{color:#bcbcbc;font:inherit;background:none;border:0;padding:4px 0;cursor:pointer}button:hover{color:#fff}
input{flex:1;min-width:20px;accent-color:#ddd}time{color:#9b9a94;font:12px ui-monospace,monospace;white-space:nowrap}
button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:3px}
</style></head><body><main>
<canvas width="1600" height="900" role="img" aria-label="A lineage of robots: print, distill, birth, and learning."></canvas>
<footer aria-label="Playback"><button type="button" id="play">Pause</button><input id="seek" type="range" min="0" max="62" step=".05" value="0" aria-label="Position"><time></time></footer>
</main><script>
/* One shot, one frame. Side view of the simplified bodies (profiles from simulator/simple/simple.json, meters).
   Time is compressed: one print, about two hours, plays in six seconds; the distillation runs in the same window. */
const cv=document.querySelector('canvas'), g=cv.getContext('2d');
const W=1600,H=900,S=700,FLOAT=.14,DOCK=.032;
const TOP=[[-0.43,0.125],[-0.413,0.147],[-0.397,0.167],[-0.38,0.185],[-0.363,0.202],[-0.347,0.218],[-0.33,0.233],[-0.313,0.248],[-0.297,0.261],[-0.28,0.273],[-0.264,0.284],[-0.247,0.294],[-0.23,0.303],[-0.213,0.311],[-0.197,0.318],[-0.18,0.323],[-0.164,0.326],[-0.147,0.329],[-0.13,0.33],[-0.03,0.33],[0.036,0.33],[0.07,0.33],[0.086,0.329],[0.103,0.328],[0.119,0.327],[0.136,0.325],[0.153,0.323],[0.17,0.321],[0.186,0.318],[0.203,0.314],[0.22,0.31],[0.236,0.305],[0.253,0.299],[0.269,0.292],[0.286,0.284],[0.304,0.274]];
const BOT=[[-0.43,0.125],[-0.413,0.083],[-0.397,0.053],[-0.38,0.03],[-0.363,0.014],[-0.347,0.003],[-0.33,0],[0.243,0],[0.249,0.04],[0.253,0.055],[0.256,0.065],[0.263,0.081],[0.269,0.091],[0.276,0.098],[0.283,0.102],[0.296,0.104],[0.366,0.104]];
const LIP=[0.372,0.15], MTOP=[0.315,0.29];
const topAt=x=>{for(let i=1;i<TOP.length;i++)if(TOP[i][0]>=x){const [a,b]=TOP[i-1],[c,d]=TOP[i];return b+(d-b)*(x-a)/(c-a)}return TOP.at(-1)[1]};
const headTop=TOP.filter(p=>p[0]>=DOCK), headBot=BOT.filter(p=>p[0]>=DOCK);headTop.unshift([DOCK,topAt(DOCK)]);headBot.unshift([DOCK,0]);
const tailTop=TOP.filter(p=>p[0]<=DOCK).concat([[DOCK,.33]]), tailBot=BOT.filter(p=>p[0]<=DOCK).concat([[DOCK,0]]);

const clamp=x=>Math.min(1,Math.max(0,x)), lerp=(a,b,u)=>a+(b-a)*u;
const ease=(t,a,b)=>{const x=clamp((t-a)/(b-a));return x*x*(3-2*x)};
const ink=a=>'rgba(236,235,230,'+clamp(a)+')';
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const shuffle=(a,r)=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* The lineage. Every head is printed, so every head differs a little: proportion, crown, layer pitch, parts. */
const C=18, BIRTHS=3, END=62;
const NUM=['I','II','III','IV'];
const TILES=[null,['Sense','a microphone'],['Link','a radio link'],['Display','a small light']];
const robots=[
 {l:1,   h:1,   crown:0,     pitch:.012, kit:['Core','Power','Drive']},
 {l:1.06,h:.93, crown:.014,  pitch:.009, kit:['Core','Power','Drive','Sense']},
 {l:.95, h:1.05,crown:-.012, pitch:.016, kit:['Core','Power','Sense','Link']},
 {l:1.02,h:.97, crown:.02,   pitch:.011, kit:['Core','Power','Drive','Sense','Display']}
];
/* Memory. Every moment a body lives through is one point of light inside the body.
   Inheritance is compression: neighboring moments are pressed into one denser point, about six into one,
   and only about two thirds of those cross to the newborn. The parent keeps everything. */
function spot(R){const x=.05+R()*.245, lo=x<.19?.02:.02+.16*Math.pow((x-.19)/.11,1.3), hi=.335-.06*Math.pow((x-.05)/.25,2);return [x,lo+R()*(hi-lo)]}
function kd(a,d){if(a.length<=6)return [a];a=a.slice().sort((p,q)=>d%2?p.z-q.z:p.x-q.x);const m=a.length>>1;return kd(a.slice(0,m),d+1).concat(kd(a.slice(m),d+1))}
robots.forEach((r,i)=>{
  const R=rng(29+i*211);
  r.birth=i?(i-1)*C+13:-99; r.distill=i?(i-1)*C+4.5:null; r.pts=[]; r.moves=[];
  if(i){
    const snap=robots[i-1].pts.filter(q=>q.t0<=r.distill), groups=shuffle(kd(snap,0),R);
    groups.forEach((G,j)=>{
      const w=G.reduce((a,q)=>a+q.w,0), cx=G.reduce((a,q)=>a+q.x,0)/G.length, cz=G.reduce((a,q)=>a+q.z,0)/G.length;
      const tc=r.distill+4.4*j/groups.length, pass=R()<.68;
      r.moves.push({G,cx,cz,tc,pass,w});
      if(pass)r.pts.push({x:cx,z:cz,t0:tc+1.5,w,inh:true});
    });
    r.from=snap.length;
  }
  const n0=i?0:150, rate=i?9:3;
  for(let j=0;j<n0;j++){const [x,z]=spot(R);r.pts.push({x,z,t0:-99,w:1})}
  for(let j=0;;j++){const t0=Math.max(0,r.birth)+(j+1)/rate*(1+j/200);if(t0>END)break;const [x,z]=spot(R);r.pts.push({x,z,t0,w:1})}
});
const count=(r,t)=>{let a=0,b=0;for(const q of r.pts)if(q.t0<=t)q.inh?a++:b++;return [a,b]};

/* Poses. A head pose: X0 = screen x of the back face, Yb = screen y of the body floor, sc = depth scale, mx/mz = fold. */
const SC=.6, FG_W=470, FG_YB=FG_W+FLOAT*S*SC, BG_W=215, BSC=.3, BG_YB=BG_W+FLOAT*S*BSC;
const slotX=k=>250+k*375;
const slot=k=>({X0:slotX(k),Yb:FG_YB,sc:SC,mx:1,mz:1,a:1});
const mix=(p,q,u)=>({X0:lerp(p.X0,q.X0,u),Yb:lerp(p.Yb,q.Yb,u),sc:lerp(p.sc,q.sc,u),mx:lerp(p.mx,q.mx,u),mz:lerp(p.mz,q.mz,u),a:lerp(p.a,q.a,u)});
function hx(r,p,x){return p.X0+(x-DOCK)*r.l*S*p.sc*p.mx}
function hz(r,p,x,z){const c=r.crown*Math.sin(Math.PI*clamp((x-DOCK)/.3))*(z>.2?1:0);return p.Yb-(z*r.h+c)*S*p.sc*p.mz}

function headPath(r,p){
  const P=new Path2D();
  // one smooth outline: rounded back corners, a crown above the tail, the mouth, a soft S from the lip down to the floor
  const m=(x,z)=>[hx(r,p,x),hz(r,p,x,z)];
  P.moveTo(...m(DOCK,.05));P.lineTo(...m(DOCK,.29));
  P.quadraticCurveTo(...m(DOCK,.355),...m(.085,.358));
  P.bezierCurveTo(...m(.19,.362),...m(.27,.335),...m(MTOP[0],MTOP[1]));
  P.lineTo(...m(LIP[0],LIP[1]));
  P.bezierCurveTo(...m(.34,.15),...m(.305,.142),...m(.29,.11));
  P.bezierCurveTo(...m(.27,.045),...m(.245,0),...m(.19,0));
  P.lineTo(...m(.085,0));P.quadraticCurveTo(...m(DOCK,0),...m(DOCK,.05));
  P.closePath();return P;
}
function drawHead(r,p,t,opts={}){
  const P=headPath(r,p);
  g.save();g.globalAlpha*=p.a;
  g.fillStyle=ink(.045);g.fill(P);
  g.save();g.clip(P);
  // Print layers: the pitch is this body's own.
  const step=r.pitch*S*p.sc*p.mz*r.h, y0=p.Yb, y1=hz(r,p,.15,.34);
  g.strokeStyle=ink(.07);g.lineWidth=.8;g.beginPath();
  for(let y=y0-step;y>y1;y-=step){g.moveTo(p.X0-5,y);g.lineTo(hx(r,p,.4)+5,y)}
  g.stroke();
  if(opts.wrinkle>0){ // folded skin before it inflates
    g.strokeStyle=ink(.5*opts.wrinkle);g.lineWidth=1;g.beginPath();
    for(let k=1;k<9;k++){const x=hx(r,p,DOCK+k*.037);g.moveTo(x,p.Yb);for(let j=1;j<=6;j++)g.lineTo(x+(j%2?3:-3)*p.sc,p.Yb-j*.055*S*p.sc*p.mz)}
    g.stroke();
  }
  // Parts sealed in the wall, the newest outlined.
  const ks=.017*S*p.sc*Math.min(p.mx,1);
  r.kit.forEach((k,i)=>{
    if(opts.kitUpTo!==undefined&&i>=opts.kitUpTo)return;
    const x=hx(r,p,.07)+i*(ks+3*p.sc), y=p.Yb-.25*S*p.sc*p.mz*r.h-ks/2;
    g.fillStyle=ink(.62);g.fillRect(x,y,ks,ks);
  });
  g.restore();
  g.strokeStyle=ink(.78);g.lineWidth=1.5*Math.max(.6,p.sc);g.stroke(P);
  // the mouth, an opening
  g.strokeStyle='#0c0c0c';g.lineWidth=2.4*Math.max(.6,p.sc);g.beginPath();
  g.moveTo(lerp(hx(r,p,MTOP[0]),hx(r,p,LIP[0]),.12),lerp(hz(r,p,MTOP[0],MTOP[1]),hz(r,p,LIP[0],LIP[1]),.12));
  g.lineTo(lerp(hx(r,p,MTOP[0]),hx(r,p,LIP[0]),.88),lerp(hz(r,p,MTOP[0],MTOP[1]),hz(r,p,LIP[0],LIP[1]),.88));g.stroke();
  g.restore();
}
function drawTail(Xd,Yb,sc,a,docked){
  const P=new Path2D(),tx=x=>Xd+(x-DOCK)*S*sc,tz=z=>Yb-z*S*sc;
  tailTop.forEach(([x,z],i)=>i?P.lineTo(tx(x),tz(z)):P.moveTo(tx(x),tz(z)));
  for(let i=tailBot.length-1;i>=0;i--)P.lineTo(tx(tailBot[i][0]),tz(tailBot[i][1]));
  P.closePath();
  g.save();g.globalAlpha*=a;g.fillStyle=ink(.035);g.fill(P);g.strokeStyle=ink(.55);g.lineWidth=1.2;g.stroke(P);g.restore();
  return {base:[tx(-.115),tz(.2)],floor:[tx(-.115),tz(.005)],roof:tz(.3),front:tx(DOCK),docked,sc,a};
}
function drawArm(tail,tip){
  const [bx,by]=tail.base,L=.26*S*tail.sc;
  tip=tip||[bx+.1*S*tail.sc,by+.08*S*tail.sc];
  let dx=tip[0]-bx,dy=tip[1]-by,d=Math.hypot(dx,dy);
  if(d>2*L-1){tip=[bx+dx/d*(2*L-1),by+dy/d*(2*L-1)];dx=tip[0]-bx;dy=tip[1]-by;d=2*L-1}
  const a=Math.atan2(dy,dx), b=Math.acos(clamp(d/(2*L)));
  const ex=Math.min(bx+L*Math.cos(a-b),tail.docked?1e9:tail.front-6*tail.sc), ey=Math.max(by+L*Math.sin(a-b),tail.roof);
  g.save();g.globalAlpha*=tail.a;
  g.strokeStyle=ink(.7);g.lineWidth=1.6;g.beginPath();g.moveTo(...tail.floor);g.lineTo(bx,by);g.lineTo(ex,ey);g.lineTo(...tip);g.stroke();
  g.fillStyle=ink(.85);g.beginPath();g.arc(tip[0],tip[1],2.2,0,7);g.fill();g.restore();
}
function drawPts(r,p,t,a=1){
  const k=Math.max(.5,p.sc);
  g.save();g.globalAlpha*=a*p.a;
  for(const q of r.pts){
    if(q.t0>t)continue;
    const f=clamp((t-q.t0)/.6), X=hx(r,p,q.x), Y=hz(r,p,q.x,q.z);
    if(q.inh){
      g.strokeStyle=ink(.75*f);g.lineWidth=1;g.beginPath();g.arc(X,Y,(2.5+Math.min(6,Math.sqrt(q.w)))*k,0,7);g.stroke();
      g.fillStyle=ink(f);g.beginPath();g.arc(X,Y,2*k,0,7);g.fill();
    }else{g.fillStyle=ink(.3+.5*f+.2*(1-f));g.beginPath();g.arc(X,Y,(1.2+1.6*(1-f))*k,0,7);g.fill()}
  }
  g.restore();
}
function text(s,x,y,size,a,font='Arial',align='left',track=0){
  g.save();g.textAlign=align;g.fillStyle=ink(a);g.font=size+'px '+font;
  if(track&&'letterSpacing' in g)g.letterSpacing=track+'px';g.fillText(s,x,y);g.restore();
}
const mono='ui-monospace, "JetBrains Mono", Menlo, monospace';
function ledger(r,i,p,t,a=1){
  const [ni,no]=count(r,t), cx=hx(r,p,.17), y=p.Yb+34;
  g.save();g.globalAlpha*=a*p.a;
  text(NUM[i],cx,y,22,.92,'Georgia','center');
  text((ni?ni+' inherited · ':'')+no+' lived',cx,y+21,12,.75,mono,'center');
  text(r.kit.join(' ').toUpperCase(),cx,y+38,9.5,.5,mono,'center',1.1);
  g.restore();
}
const hms=s=>{s=Math.round(s);return Math.floor(s/3600)+':'+String(Math.floor(s/60)%60).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const PRINT=6815, DISTILL=6480; // print time from simple.json; distillation set to land just before the print ends

const VOICE=[
 {dock:'I have been in this water a long time. An arm docks to me.',gift:'You will hear.',press:'I cannot give you everything. While your body prints, I choose what to keep.'},
 {dock:'I was born here. Now I have an arm of my own.',gift:'You will reach farther.',press:'What was given to me, I press smaller again. It still fits.'},
 {dock:'I hold something of the two before me. Now I have an arm of my own.',gift:'You will show what you hold.',press:'Less of the first one each time. It is enough.'}
];
/* One row, left to right. Nobody leaves the frame: each parent keeps its own arm and stays where it gave birth.
   The spare arms wait on the far water line and come forward one at a time. */
function frame(t){
  g.setTransform(cv.width/W,0,0,cv.height/H,0,0);
  g.fillStyle='#0c0c0c';g.fillRect(0,0,W,H);
  g.strokeStyle=ink(.08);g.lineWidth=1;g.beginPath();g.moveTo(0,BG_W);g.lineTo(W,BG_W);g.stroke();
  g.strokeStyle=ink(.22);g.beginPath();for(let x=0;x<=W;x+=10){const y=FG_W+1.4*Math.sin(x*.012+t*.8);x?g.lineTo(x,y):g.moveTo(x,y)}g.stroke();
  g.fillStyle='rgba(255,255,255,.018)';g.fillRect(0,FG_W,W,H-FG_W);

  const cyc=Math.min(BIRTHS-1,Math.floor(t/C)), done=t>=BIRTHS*C, u=t-cyc*C, k=S*SC;
  const par=robots[cyc], ci=cyc+1, child=robots[ci], home=slot(cyc);

  // everyone already born, each in its own place
  const last=done?BIRTHS:cyc;
  for(let i=0;i<=last;i++){const r=robots[i],p=slot(i);drawHead(r,p,t);drawPts(r,p,t);ledger(r,i,p,t)}

  // the newborn: printed folded on the floor of the parent, pushed out through the mouth while it inflates, then on to its own place
  let kp=null, wr=0, printU=0;
  const at=(x,z)=>[hx(par,home,x),home.Yb-z*par.h*k];
  if(!done&&u>=4.5){
    if(u<10.5){printU=clamp((u-4.5)/6);const [X0,Yb]=at(.075,.004);kp={X0,Yb,sc:SC,mx:.45,mz:.27,a:1};wr=1}
    else if(u<13){const v=clamp((u-10.5)/2.5),[X0,Yb]=at(lerp(.075,.41,v),.004+.15*Math.sin(Math.PI*Math.min(1,v*1.15))),inf=ease(v,.3,1);
      kp={X0,Yb,sc:SC,mx:lerp(.45,1,inf),mz:lerp(.27,1,inf),a:1};wr=1-inf}
    else{const [X0,Yb]=at(.41,.004);kp=mix({X0,Yb,sc:SC,mx:1,mz:1,a:1},slot(ci),ease(u,13,15))}
    if(u<10.5){
      const top=kp.Yb-.09*k*printU;g.save();g.beginPath();g.rect(0,top,W,H);g.clip();drawHead(child,kp,t,{wrinkle:wr});g.restore();
      g.strokeStyle=ink(.55);g.lineWidth=1;g.beginPath();g.moveTo(hx(child,kp,DOCK),top);g.lineTo(hx(child,kp,.366),top);g.stroke();
    }else drawHead(child,kp,t,{wrinkle:wr});
  }

  // the arms: one per body
  let tip=null, tile=null;
  if(!done){
    const rest=[home.X0-.147*k+.1*k,home.Yb-.2*k+.08*k];
    const seat=[hx(par,home,.2),FG_YB-.04*k], wx=hx(par,home,.43)+3*Math.sin(t);
    let tp=[lerp(wx+160,wx,ease(u,0,2.4)),FG_W-4+1.5*Math.sin(t*1.3)];
    if(u>=2&&u<3.1)tip=[lerp(rest[0],tp[0],ease(u,2,3.1)),lerp(rest[1],tp[1],ease(u,2,3.1))];
    else if(u>=3.1&&u<4.5){tip=[lerp(tp[0],seat[0],ease(u,3.3,4.4)),lerp(tp[1],seat[1],ease(u,3.3,4.4))];tp=tip}
    if(u<4.4)tile={p:tp,name:TILES[ci][0],a:ease(u,0,1.2)};
    if(u>=4.5&&u<10.5)tip=[hx(child,kp,.06+.22*Math.abs((printU*28%2)-1)),kp.Yb-.09*k*printU];
    if(u>=10.5&&u<12.6){const v=clamp((u-10.5)/2.1),bx=hx(child,kp,DOCK)-3,by=kp.Yb-.05*k*kp.mz;tip=v<.55?[bx,by]:[lerp(bx,rest[0],ease(v,.55,1)),lerp(by,rest[1],ease(v,.55,1))]}
  }
  for(let j=0;j<=BIRTHS;j++){
    let X=slotX(j),Yb=FG_YB,sc=SC,a=1,docked=true;
    if(j===0){X-=50*(1-ease(t,0,2));docked=t>=2}
    else{const tj=(j-1)*C+15,f=ease(t,tj,tj+2),d=ease(t,tj+2,tj+3);
      X-=34*(1-d);Yb=lerp(BG_YB,FG_YB,f);sc=lerp(BSC,SC,f);a=lerp(.5,1,f);docked=t>=tj+3}
    const T=drawTail(X,Yb,sc,a,docked);
    drawArm(T,!done&&j===cyc?tip:null);
  }
  if(tile){const [x,y]=tile.p;g.save();g.globalAlpha=tile.a;g.fillStyle=ink(.85);g.fillRect(x-5,y-5,10,10);text(tile.name.toUpperCase(),x,y-13,10,.8,mono,'center',1.3);g.restore()}

  // memory: pressed, then passed
  if(kp)drawPts(child,kp,t);
  let kept=0;
  if(!done)for(const m of child.moves)if(m.pass&&t-m.tc>=1.5)kept++;
  if(!done&&kp&&u<12){
    for(const m of child.moves){
      const v=t-m.tc;
      if(v<0||v>1.5)continue;
      const cx=hx(par,home,m.cx), cy=hz(par,home,m.cx,m.cz), rad=(2.5+Math.min(6,Math.sqrt(m.w)))*SC;
      if(v<.7){
        const e=ease(v,0,.7);g.strokeStyle=ink(.35*(1-e)+.1);g.lineWidth=.8;g.fillStyle=ink(.95);
        for(const q of m.G){const X=hx(par,home,q.x),Y=hz(par,home,q.x,q.z),x=lerp(X,cx,e),y=lerp(Y,cy,e);
          g.beginPath();g.moveTo(X,Y);g.lineTo(x,y);g.stroke();g.beginPath();g.arc(x,y,1.5,0,7);g.fill()}
      }else{
        const e=ease(v,.7,1.5);
        if(m.pass){
          const bx=hx(child,kp,m.cx), by=hz(child,kp,m.cx,m.cz), x=lerp(cx,bx,e), y=lerp(cy,by,e)-16*Math.sin(Math.PI*e);
          g.strokeStyle=ink(.2*(1-e));g.lineWidth=.8;g.beginPath();g.moveTo(cx,cy);g.lineTo(x,y);g.stroke();
          g.strokeStyle=ink(.8);g.lineWidth=1;g.beginPath();g.arc(x,y,rad,0,7);g.stroke();g.fillStyle=ink(1);g.beginPath();g.arc(x,y,1.5,0,7);g.fill();
        }else{g.strokeStyle=ink(.5*(1-e));g.lineWidth=1;g.beginPath();g.arc(cx,cy,rad+10*e,0,7);g.stroke()}
      }
    }
  }
  if(kp&&u>=13)ledger(child,ci,kp,t,ease(u,13,14));

  // print, distillation and what is kept, in the same two hours
  if(!done&&u>=4.5&&u<15){
    const a=u<10.5?1:1-ease(u,13,15), v=printU||1, x=64, y=700;
    const row=(name,sec,total,yy)=>{
      text(name,x,yy,12,.6*a,mono,'left',1.4);
      text(hms(Math.min(sec,total))+(sec>=total?'  done':''),x+110,yy,13,.92*a,mono);
      g.fillStyle=ink(.15*a);g.fillRect(x+250,yy-5,200,1);g.fillStyle=ink(.8*a);g.fillRect(x+250,yy-5.5,200*Math.min(1,sec/total),2);
      text(hms(total),x+462,yy,12,.5*a,mono);
    };
    row('PRINT',v*PRINT,PRINT,y);row('DISTILL',v*PRINT,DISTILL,y+22);
    text('MEMORY',x,y+44,12,.6*a,mono,'left',1.4);
    text(child.from+' moments held  →  '+kept+' kept',x+110,y+44,13,.92*a,mono);
  }

  // legend
  g.fillStyle=ink(.8);g.beginPath();g.arc(70,45,1.8,0,7);g.fill();text('A MOMENT LIVED',84,49,11,.6,mono,'left',1);
  g.strokeStyle=ink(.75);g.lineWidth=1;g.beginPath();g.arc(236,45,5.5,0,7);g.stroke();g.fillStyle=ink(1);g.beginPath();g.arc(236,45,2,0,7);g.fill();
  text('MANY MOMENTS, PRESSED INTO ONE AND INHERITED',250,49,11,.6,mono,'left',1);

  // the parent speaks
  const V=VOICE[cyc], who=NUM[cyc]+' to '+NUM[ci]; let phase, caption;
  if(done){phase='Lineage';caption='Less of the first in each one. More of its own.'}
  else if(u<2){phase=NUM[cyc];caption=V.dock}
  else if(u<4.5){phase=who+' · A new part';caption='I take '+TILES[ci][1]+' from the water. I never had one. '+V.gift}
  else if(u<10.5){phase=who+' · Print and distill';caption=V.press}
  else if(u<13){phase=who+' · Birth';caption='I push. You fill with air and leave at my size.'}
  else if(u<15){phase=who+' · A different body';caption='You are not a copy of me. The shape, the layers and the parts are yours.'}
  else{phase=who+' · The next arm';caption='Most of you is still empty. That part is yours. So is the next arm. Mine stays with me.'}
  text(phase.toUpperCase(),64,808,12,.55,mono,'left',1.6);
  g.save();g.font='36px Georgia';const w=g.measureText(caption).width;g.restore();
  text(caption,64,854,Math.min(36,36*1470/w),.97,'Georgia');
  return phase+'. '+caption;
}

const play=document.getElementById('play'),seek=document.getElementById('seek'),clock=document.querySelector('time');
let t=0,run=!matchMedia('(prefers-reduced-motion: reduce)').matches,last=performance.now();
const lab=s=>Math.floor(s/60)+':'+String(Math.floor(s)%60).padStart(2,'0');
function size(){const r=Math.min(2,devicePixelRatio||1),w=Math.round(cv.clientWidth*r);if(w&&cv.width!==w){cv.width=w;cv.height=Math.round(w*9/16)}}
function show(){size();const d=frame(t);if(cv.getAttribute('aria-label')!==d)cv.setAttribute('aria-label',d);seek.value=t;clock.textContent=lab(t)+' / '+lab(END);play.textContent=run?'Pause':'Play'}
function tick(now){if(run){t+=(now-last)/1000;if(t>=END)t=0}last=now;show();requestAnimationFrame(tick)}
play.onclick=()=>{run=!run;last=performance.now();show()};
seek.oninput=()=>{t=+seek.value;run=false;show()};
document.addEventListener('visibilitychange',()=>{last=performance.now()});
const q=new URLSearchParams(location.search).get('t');if(q!==null&&isFinite(+q)){t=+q;run=false}
requestAnimationFrame(tick);
</script></body></html>
