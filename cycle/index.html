function arrowPx(x1,y1,x2,y2,a=.5){g.strokeStyle=ink(a);g.lineWidth=1.4;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);const an=Math.atan2(y2-y1,x2-x1);
  g.moveTo(x2-9*Math.cos(an-.45),y2-9*Math.sin(an-.45));g.lineTo(x2,y2);g.lineTo(x2-9*Math.cos(an+.45),y2-9*Math.sin(an+.45));g.stroke()}
function caption(n,title,body,x,y,opt){g.font='bold 30px '+font;g.fillStyle=ink(.95);g.textAlign='left';g.fillText(n,x,y+4);
  text(title,x+36,y,21,.95,'left',true);
  if(opt){const w=g.measureText(title).width;g.font='12px '+font;const tw=g.measureText('OPTIONAL').width+16;const bx=x+36+w+14;g.strokeStyle=ink(.55);g.lineWidth=1;g.strokeRect(bx+.5,y-16.5,tw,22);text('OPTIONAL',bx+8,y-1,12,.75)}
  lines(body,x+36,y+30,16,.62,22)}

function draw(){
  g.setTransform(cv.width/W,0,0,cv.height/H,0,0);g.fillStyle='#000';g.fillRect(0,0,W,H);
  lines(['Side views at one scale, after the simplified simulator. The robot is two bodies. The tail holds the arm, the kit magazine, the store, the pumps and the brain.',
         'The head is a bare shell that holds the gel, with a mouth turned up. The tail prints a newborn in the gel and gives “birth” to it. Step 5 is optional.'],40,44,17,.62,26);

  // 1 Dock
  { const o={x:40+20+6.9*S,y:400};water(o,-10,470);gel(o);head(o);tail(o);arm(o,FOLD);
    arrowPx(o.x-36,o.y-120,o.x-6,o.y-120,.6);
    label('tail: arm, store, pumps, brain',o,40,60,-4,4);label('head, the gel chamber',o,300,30,250,4);
    label('docking plane, gel face to gel face',o,DOCK,150,230,250,'left');label('mouth, open',o,403,78,430,46);
    label('kit magazine, 3 kits',o,62,206,-4,262);label('gel',o,360,190,450,262);
    caption('1','Dock',['The tail swims in and docks from behind, gel face to gel face,','in the water. Three magnets hold the seam. The gel stays in the head.'],40,470); }
  // 2 Print
  { const o={x:840+20+6.9*S,y:400};water(o,-10,470);gel(o);head(o);tail(o);folded(o);arm(o,[[110,174],[170,70],[285,108],[285,204]]);
    label('print needle',o,285,150,330,4);label('kit, set first from the magazine',o,270,216,120,262);label('newborn, folded flat in the gel',o,322,210,350,262);
    caption('2','Print',['The arm sets a kit on the floor, changes to the print needle and','prints the newborn folded around it, layer by layer, in clear silicone.'],840,470); }
  // 3 Birth
  { const o={x:1640+20+6.9*S,y:400};water(o,-10,540);gel(o);head(o);tail(o);
    egg(o,452,112,112,66,-.55,.55);arm(o,[[110,174],[190,60],[330,96],[404,134]]);
    label('air through the needle',o,380,118,236,4);label('fills as it leaves the mouth',o,470,84,400,-14);
    label('over the lower lip',o,422,128,430,262);
    caption('3','“Birth”',['The needle presses the tail end down; the nose rises over the lower','lip. The newborn fills with air as it is pushed out, like a balloon.'],1640,470); }
  // 4 Grow
  { const o={x:40+20+6.9*S,y:820};water(o,-10,870);gel(o);head(o);tail(o);arm(o,FOLD);
    const cx=690,cy=128;const tr=egg(o,cx,cy,280,190,0,.95,22);
    // the dashed size at release, and its kit
    g.save();g.setLineDash([4,5]);g.strokeStyle=ink(.3);g.lineWidth=1;const r=[];for(let i=0;i<=80;i++){const t=i/80*Math.PI*2,c=Math.cos(t);r.push([cx+84*c,cy+20+57*Math.sin(t)*(1-.12*c)])}poly(o,r,true);g.stroke();g.restore();
    rr(o,cx-40,cy+62,40,16,3,'#cfc8ba');
    for(const [bx,by,br] of [[cx+10,cy+40,4],[cx+30,cy+20,3],[cx+18,cy+0,5],[cx+44,cy-14,3.5],[cx-8,cy+16,3]]){const [X,Y]=T(o,bx,by);g.strokeStyle=ink(.55);g.lineWidth=1;g.beginPath();g.arc(X,Y,br*S,0,7);g.stroke()}
    { const [X,Y]=T(o,cx-150,cy+50);for(let i=0;i<3;i++)arrowPx(X-10-i*18,Y,X-30-i*18,Y,.35) }
    label('at release',o,cx+60,cy+50,cx+110,262);label('grown',o,cx+120,cy-60,cx+150,10);
    label('its kit: pump, chip, cell, soda tablet',o,cx-20,cy+70,cx-240,262);label('carbon dioxide',o,cx+18,cy,cx+40,10);
    label('opening at the rear, closed for now',o,cx-118,cy-40,cx-260,10);
    caption('4','Grow',['Released, the newborn floats and swims on the small pump in its kit. The pump meters water onto a soda tablet;','carbon dioxide fills the body until the pleats flatten. The model on its chip keeps learning.'],40,890); }
  // 5 Optional: the tail moves to the newborn
  { const ox=1220;const o1={x:ox+20-DOCK*S,y:820};water(o1,DOCK-6,440);gel(o1);head(o1);
    label('the head it came with, left behind',o1,300,30,DOCK,10);
    arrowPx(o1.x+446*S,620,o1.x+510*S,620,.55);
    const o2={x:ox+430+6.9*S,y:820};water(o2,-10,DOCK+300);
    egg(o2,DOCK+140-22,123,280,198,0,1,22);
    {const [a,b]=T(o2,DOCK,196),[c,d]=T(o2,DOCK+280,FLOOR+2);g.save();g.beginPath();const P=[];for(let i=0;i<=120;i++){const t=i/120*Math.PI*2,cc=Math.cos(t);let x=140*cc;if(x<-118)x=-118;P.push([DOCK+118+x,123+99*Math.sin(t)*(1-.12*cc)])}poly(o2,P,true);g.clip();g.fillStyle='rgba(222,170,90,.22)';g.fillRect(a,b,c-a,d-b);g.strokeStyle='rgba(222,170,90,.6)';g.beginPath();g.moveTo(a,b);g.lineTo(c,b);g.stroke();g.restore()}
    tail(o2);arm(o2,[[110,174],[178,70],[268,120],[268,184]]);
    label('the tail, free',o2,60,200,-4,262);label('docks into the opening at the newborn’s rear',o2,DOCK+4,70,DOCK+60,10);
    label('gel, topped up from the store',o2,300,205,300,262);
    caption('5','The tail moves on',['The tail lets go of the head it came with, swims to the grown newborn and docks into','the opening at its rear. With the gel topped up, the newborn can give “birth” too.'],1220,890,true); }
}
function show(){const r=Math.min(2,devicePixelRatio||1),w=Math.round(cv.clientWidth*r);if(w&&cv.width!==w&&!/png/.test(location.search)){cv.width=w;cv.height=Math.round(w*H/W)}draw()}
show();new ResizeObserver(show).observe(cv);
</script></body></html>
