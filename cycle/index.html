<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The cycle · simplified version</title>
<style>html,body{margin:0;background:#000}canvas{display:block;width:100%;height:auto}</style></head><body>
<canvas id="c" width="2400" height="1105" role="img" aria-label="The cycle, side views from the simplified simulator: dock, print, birth, born small and folded, and, optionally, growing outside the body as the folds open."></canvas>
<script>
/* Side views at one scale, after the simplified simulator (simulator/simple), in its own units (1 unit is about 1.7 mm).
   Floor at y 222, water at y 168, docking plane at x 190.7. Outline redrawn round, as sketched: two rounded bodies. */
const cv=document.getElementById('c'),g=cv.getContext('2d'),W=2400,H=1105,S=1.25;
const ink=a=>'rgba(236,235,230,'+a+')',font='Arial, Helvetica, sans-serif';
const DOCK=190.7,FLOOR=222,WATER=168,GEL=162.5,MTOP=[382,28.5],LIP=[424.5,129];
function bez(segs){const out=[];let c=segs[0];out.push(c);for(const s of segs.slice(1)){for(let i=1;i<=30;i++){const t=i/30,u=1-t;out.push([0,1].map(k=>u*u*u*c[k]+3*u*u*t*s[0][k]+3*u*t*t*s[1][k]+t*t*t*s[2][k]))}c=s[2]}return out}
// tail: top from the docking plane back, round rear, floor, then up into the notch at the docking plane
const TAIL=bez([[DOCK,25.6],[[150,25.6],[95,25.6],[60,32]],[[18,42],[-15,90],[-15,135]],[[-15,175],[0,210],[40,221]],[[80,222],[130,222],[156,221]],[[176,220],[DOCK-4,200],[DOCK-2,182]]]);
const HEAD=bez([[DOCK+2,182],[[DOCK+4,205],[195,219],[214,221]],[[250,222],[300,222],[330,221]],[[372,219],[410,180],[LIP[0],LIP[1]]]]);
const HEADTOP=[[DOCK,25.6],MTOP];
function T(o,x,y){return [o.x+x*S,o.y+(y-FLOOR)*S]}
function path(o,pts,close){g.beginPath();pts.forEach(([x,y],i)=>{const [X,Y]=T(o,x,y);i?g.lineTo(X,Y):g.moveTo(X,Y)});if(close)g.closePath()}
function text(s,x,y,size=15,a=.6,align='left',bold=false){g.font=(bold?'bold ':'')+size+'px '+font;g.fillStyle=ink(a);g.textAlign=align;g.fillText(s,x,y)}
function lines(arr,x,y,size,a,lh){arr.forEach((s,i)=>text(s,x,y+i*lh,size,a))}
function label(s,o,ax,ay,lx,ly){const [A,B]=T(o,ax,ay),[X,Y]=T(o,lx,ly);g.strokeStyle=ink(.35);g.lineWidth=1;g.beginPath();g.moveTo(A,B);g.lineTo(X,Y+4);g.stroke();text(s,X,Y,14,.62)}
function water(o,x0,x1){const [a,b]=T(o,x0,WATER),[c,d]=T(o,x1,FLOOR);g.fillStyle='#0c1620';g.fillRect(a,b,c-a,d-b+16);
  g.strokeStyle='rgba(130,170,200,.35)';g.setLineDash([4,5]);g.beginPath();g.moveTo(a,b);g.lineTo(c,b);g.stroke();g.setLineDash([]);
  g.strokeStyle=ink(.25);g.beginPath();g.moveTo(a,d+16);g.lineTo(c,d+16);g.stroke()}
const headShape=[...HEADTOP,...[...HEAD].reverse()];          // top, mouth top, then lip back to the notch
function head(o){
  g.fillStyle='rgba(236,235,230,.035)';path(o,[[DOCK,25.6],MTOP,...[...HEAD].reverse(),[DOCK,182]],true);g.fill();
  // gel: inside the head, below the gel line
  g.save();path(o,[[DOCK,25.6],MTOP,...[...HEAD].reverse(),[DOCK,182]],true);g.clip();
  const [a,b]=T(o,DOCK-5,GEL),[c,d]=T(o,LIP[0]+5,FLOOR+5);g.fillStyle='rgba(222,170,90,.17)';g.fillRect(a,b,c-a,d-b);
  g.strokeStyle='rgba(222,170,90,.6)';g.lineWidth=1.2;g.beginPath();g.moveTo(a,b);g.lineTo(c,b);g.stroke();g.restore();
  g.strokeStyle=ink(.85);g.lineWidth=2;path(o,HEADTOP);g.stroke();path(o,HEAD);g.stroke();
  g.lineWidth=1.6;g.beginPath();g.moveTo(...T(o,DOCK,25.6));g.lineTo(...T(o,DOCK,182));g.stroke();
  g.setLineDash([5,5]);g.strokeStyle=ink(.4);g.lineWidth=1.2;g.beginPath();g.moveTo(...T(o,...MTOP));g.lineTo(...T(o,...LIP));g.stroke();g.setLineDash([]);
}
function box(o,x,y,w,h,r,fill){const [X,Y]=T(o,x,y);g.beginPath();g.roundRect(X,Y,w*S,h*S,r);g.fillStyle=fill;g.fill()}
function tail(o){
  g.fillStyle='rgba(236,235,230,.035)';path(o,TAIL,true);g.fill();
  g.strokeStyle=ink(.85);g.lineWidth=2;path(o,TAIL);g.stroke();
  g.lineWidth=1.6;g.beginPath();g.moveTo(...T(o,DOCK,25.6));g.lineTo(...T(o,DOCK,182));g.stroke();
  box(o,12,102,26,14,4,'#4a4a4a');                 // pump
  box(o,14,132,40,22,3,'#545454');                 // brain and cell
  for(let i=0;i<3;i++)box(o,40+i*15,205,12,10,2,'#8f887c');  // kit magazine
}
/* Rotrics DexArm, side view: base, turret, upper arm, forearm with its parallel link, a flange that stays level, the tool hanging down */
const SH=[118,164],L1=88,L2=96;
function ik(w){const dx=w[0]-SH[0],dy=w[1]-SH[1],d=Math.min(Math.hypot(dx,dy),L1+L2-1),a=Math.atan2(dy,dx),b=Math.acos((L1*L1+d*d-L2*L2)/(2*L1*d));return [SH[0]+L1*Math.cos(a-b),SH[1]+L1*Math.sin(a-b)]}
function link(o,a,b,w,col){g.strokeStyle=col;g.lineWidth=w*S;g.lineCap='round';g.beginPath();g.moveTo(...T(o,...a));g.lineTo(...T(o,...b));g.stroke();g.lineCap='butt'}
function dexarm(o,wr,tool=30,tube=null){
  const el=ik(wr);
  box(o,SH[0]-32,206,64,15,4,'#5a5a5a');                    // base
  box(o,SH[0]-20,170,40,37,6,'#4c4c4c');                    // turret
  const par=[[SH[0]-9,SH[1]-6],[el[0]-9,el[1]-6]];
  link(o,[SH[0]-14,SH[1]+2],[el[0]-12,el[1]+6],3,'#5e5e5e');   // rear rod of the parallelogram
  link(o,SH,el,11,'#6f6f6f');                                // upper arm
  link(o,[el[0]+2,el[1]-7],[wr[0]-6,wr[1]-7],3,'#5e5e5e');    // forearm parallel link
  link(o,el,wr,9,'#7a7a7a');                                 // forearm
  box(o,wr[0]-7,wr[1]-8,16,18,3,'#8a8a8a');                  // level flange
  g.strokeStyle='#b0b0b0';g.lineWidth=2;g.beginPath();g.moveTo(...T(o,wr[0]+1,wr[1]+10));g.lineTo(...T(o,wr[0]+1,wr[1]+10+tool));g.stroke();
  for(const p of [SH,el]){g.fillStyle='#9a9a9a';g.beginPath();g.arc(...T(o,...p),4,0,7);g.fill()}
  if(tube){g.strokeStyle='rgba(200,200,200,.55)';g.lineWidth=1.4;g.beginPath();g.moveTo(...T(o,wr[0]+1,wr[1]+10+tool));g.bezierCurveTo(...T(o,wr[0]+30,wr[1]+tool+30),...T(o,tube[0]-30,tube[1]+10),...T(o,...tube));g.stroke()}
}
const FOLDED=[164,112];
const NB_F='rgba(160,104,66,.5)',NB_S='#c48b5c';
function folded(o){const pts=[[238,220]];for(let i=0;i<=12;i++)pts.push([238+i*7.4,i%2?206:211]);pts.push([327,220]);
  g.fillStyle=NB_F;path(o,pts,true);g.fill();g.strokeStyle=NB_S;g.lineWidth=1.5;g.stroke();box(o,268,212,18,7,2,'#cfc8ba')}
/* the newborn: an egg with a rounder rear; its sides are pleated, and the pleats open as it grows (fold 1 = fully pleated, 0 = smooth) */
function egg(o,cx,cy,L,Hh,rot,fold,kit=true){
  const n=Math.round(L/14),pts=[];
  for(let i=0;i<=240;i++){const t=i/240*Math.PI*2,c=Math.cos(t);let x=L/2*c,y=Hh/2*Math.sin(t)*(1-.12*c);
    const mid=Math.max(0,1-Math.pow(Math.abs(c)/.82,6));const tri=Math.abs(((x/L*n)%1+1)%1-.5)*2;const d=fold*mid*Math.min(9,Hh*.08)*tri;
    y-=Math.sign(y)*d;pts.push([x,y])}
  const tr=([x,y])=>[cx+x*Math.cos(rot)-y*Math.sin(rot),cy+x*Math.sin(rot)+y*Math.cos(rot)];
  const P=pts.map(tr);g.fillStyle=NB_F;path(o,P,true);g.fill();g.strokeStyle=NB_S;g.lineWidth=2;g.stroke();
  if(fold>0){g.save();path(o,P,true);g.clip();g.strokeStyle='rgba(230,190,150,'+(.45*fold)+')';g.lineWidth=1;
    for(let k=1;k<n;k++){const x=-L/2+k*L/n;if(Math.abs(x)>L*.42)continue;g.beginPath();g.moveTo(...T(o,...tr([x,-Hh])));g.quadraticCurveTo(...T(o,...tr([x+3,0])),...T(o,...tr([x,Hh])));g.stroke()}g.restore()}
  if(kit){const [kx,ky]=tr([-L*.12,Hh*.28]);box(o,kx-12,ky-4,24,9,2,'#cfc8ba')}
  return tr;
}
function arrowPx(x1,y1,x2,y2,a=.5){g.strokeStyle=ink(a);g.lineWidth=1.4;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);const an=Math.atan2(y2-y1,x2-x1);
  g.moveTo(x2-9*Math.cos(an-.45),y2-9*Math.sin(an-.45));g.lineTo(x2,y2);g.lineTo(x2-9*Math.cos(an+.45),y2-9*Math.sin(an+.45));g.stroke()}
function caption(n,title,body,x,y,tag){g.font='bold 30px '+font;g.fillStyle=ink(.95);g.textAlign='left';g.fillText(n,x,y+4);
  text(title,x+36,y,21,.95,'left',true);
  if(tag){g.font='bold 21px '+font;const w=g.measureText(title).width;g.font='12px '+font;const tw=g.measureText(tag).width+16;const bx=x+36+w+14;g.strokeStyle=ink(.55);g.lineWidth=1;g.strokeRect(bx+.5,y-16.5,tw,22);text(tag,bx+8,y-1,12,.75)}
  lines(body,x+36,y+30,16,.62,22)}

function draw(){
  g.setTransform(cv.width/W,0,0,cv.height/H,0,0);g.fillStyle='#000';g.fillRect(0,0,W,H);
  lines(['Side views at one scale, after the simplified simulator. The robot is two bodies. The tail holds a DexArm, the kit magazine, a pump and the brain.',
         'The head is a bare shell that holds the gel, with a mouth turned up. The tail prints a newborn in the gel and gives “birth” to it.'],40,44,17,.62,26);
  // 1 Dock
  { const o={x:40+40,y:400};water(o,-30,460);head(o);tail(o);dexarm(o,FOLDED,22);
    arrowPx(o.x-60,o.y-120,o.x-26,o.y-120,.6);
    label('tail: arm, pump, brain',o,30,110,-20,4);label('head, the gel chamber',o,300,30,250,4);
    label('mouth, open',o,403,78,428,46);label('DexArm, folded',o,140,140,-20,262);
    label('docking plane, gel face to gel face',o,DOCK,120,215,262);label('gel',o,360,190,440,262);
    caption('1','Dock',['The tail swims in and docks from behind, gel face to gel face,','in the water. The gel stays in the head.'],40,470); }
  // 2 Print
  { const o={x:840+40,y:400};water(o,-30,460);head(o);tail(o);folded(o);dexarm(o,[284,120],78);
    label('print needle',o,285,170,330,4);label('kit, set first from the magazine',o,270,216,120,262);label('newborn, folded flat in the gel',o,322,210,340,262);
    caption('2','Print',['The arm sets a kit on the floor, then prints the newborn folded','around it, layer by layer, in clear silicone.'],840,470); }
  // 3 Birth
  { const o={x:1640+40,y:400};water(o,-30,560);head(o);tail(o);
    egg(o,462,108,104,62,-.5,1);dexarm(o,[282,96],34,[416,132]);
    label('air through the needle',o,330,150,236,4);label('half filled, still folded',o,490,80,410,-14);label('over the lower lip',o,424,130,430,262);
    caption('3','“Birth”',['Air comes through the needle; the newborn rises over the lower lip','and leaves through the mouth, half filled, still folded.'],1640,470); }
  // 4 Born
  { const o={x:40+40,y:820};water(o,-30,760);head(o);tail(o);dexarm(o,FOLDED,22);
    egg(o,600,112,112,68,0,1);
    { const [X,Y]=T(o,530,130);for(let i=0;i<3;i++)arrowPx(X-6-i*16,Y,X-22-i*16,Y,.35) }
    label('folds still closed',o,610,80,640,10);label('its kit: pump, chip, cell',o,588,131,560,262);
    caption('4','Born',['Small and folded, it swims on the small pump in its kit.','The model on its chip starts to learn.'],40,890); }
  // 5 Grow, optional: the goal
  { const ox=1080;const o={x:ox,y:820};water(o,0,1060);
    const st=[[90,112,68,1,'born'],[300,150,94,.5,'the folds open'],[575,214,140,0,'grown']];
    st.forEach(([x,L,Hh,f,s],i)=>{egg(o,x+L/2,FLOOR-Hh/2-6,L,Hh,0,f);text(s,o.x+(x+L/2)*S,o.y+40,14,.62,'center');
      if(i<2){const a=o.x+(x+L+14)*S,b=o.x+(st[i+1][0]-14)*S;arrowPx(a,o.y-60,b,o.y-60,.5)}});
    caption('5','Grow',['Outside the body, the pump meters water onto a soda tablet. Carbon dioxide fills the body,','the folds open one by one, and it grows bigger, close to the size of the head.'],1080,890,'OPTIONAL · THE GOAL'); }
}
function show(){const r=Math.min(2,devicePixelRatio||1),w=Math.round(cv.clientWidth*r);if(w&&cv.width!==w&&!/png/.test(location.search)){cv.width=w;cv.height=Math.round(w*H/W)}draw()}
show();new ResizeObserver(show).observe(cv);
</script></body></html>
