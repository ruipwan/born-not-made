  h += `<p>The new tail is printed in two quilted halves, split where the hard tail is already split for the H2S: the nose N (${(g.areaN).toFixed(3)} m2 of skin, with the battery, the Pi and the pump printed in) and the face F (${g.areaF.toFixed(3)} m2, with the arm's seat plate printed into its floor). Each is laid flat and Z folded 3 by 3 into 18 layers, like a head. The arm comes as four modules on a tray against the back glass. No floats: the base's housing is sealed and holds air, the links are light enough for the holder as they are.</p><p>The handover is face to face. The parent's tail leaves its head, turns round and docks face to face with the new tail, so its arm reaches into the new tail as it reaches into a head. It brings the modules one at a time and builds the arm upright in F's seat; from the base on the new arm has power and holds each joint where the parent can reach. Then the new tail picks up the rest by itself.</p>`;
  h += `<h3>Checks</h3>` + D.checks.map((c) => `<div class="ck ${c.ok ? "ok" : "no"}"><i>${c.ok ? "✓" : "✗"}</i><div><span class="g">${esc(c.group)}</span>${esc(c.name)}${c.value ? `<small>${esc(c.value)}</small>` : ""}</div></div>`).join("");
  h += `<h3>Notes</h3>` + D.notes.map((n) => `<p>${esc(n)}</p>`).join("");
  h += `<h3>Not solved here</h3><p>The water stands at ${(D.water * 1000).toFixed(0)} mm so the parent can steer its own base module (1.4 kg) under water; the quilted head and the hard tail then need ballast. The module masses, the sealed base, the snaps and the hinge of the seat are estimates for bench tests. Data: <a href="tailcopy.json" style="color:#dfe7ee">tailcopy.json</a>, script <a href="build.py" style="color:#dfe7ee">build.py</a>.</p>`;
  $("#side").innerHTML = h;
}

let last = 0;
function frame(nowMs) {
  requestAnimationFrame(frame);
  const now = nowMs / 1000, dt = Math.min(0.1, now - (last || now)); last = now;
  if (TL.playing) { TL.T += dt * TL.speed; if (TL.T >= TL.total) TL.T = 0; }
  const S = frameAt(TL.T), sa = stageAt(TL.T);
  apply(S, now);
  if (AUTO) autoCam(sa.s.key); stepCam(dt); R3.controls.update();
  $("#ovStage").textContent = sa.s.name; $("#ovText").textContent = sa.s.text; $("#ovClk").innerHTML = `${hms(sa.real)} <span>machine time · stage ${TL.st.indexOf(sa.s) + 1} of ${TL.st.length}</span>`;
  for (const s of TL.st) s.el.classList.toggle("on", s === sa.s);
  $("#head").style.left = (TL.T / TL.total * 100) + "%";
  if (P.N.mesh.visible && P.N.M) placeLabel(P.labN, new THREE.Vector3(-0.3, 0, 0.3).applyMatrix4(P.N.M), P.N.vis); else placeLabel(P.labN, null, false);
  if (P.F.mesh.visible && P.F.M) placeLabel(P.labF, new THREE.Vector3(-0.09, 0, 0.36).applyMatrix4(P.F.M), P.F.vis); else placeLabel(P.labF, null, false);
  placeLabel(P.labarm, new THREE.Vector3(0, 0, 0.12).applyMatrix4(m7(S.root)), S.cv > 0);
  placeLabel(P.labmouth, new THREE.Vector3(D.lip[0], 0, 0.30), CAM !== "top");
  R3.renderer.render(R3.scene, R3.camera);
}
(async function main() {
  try {
    init();
    [Q, AD, D] = await Promise.all([getJSON("../doublewall/quilt.json"), getJSON("../doublewall/arm.json"), getJSON("tailcopy.json")]);
    buildTank(); await buildParent(); buildChild(); buildTimeline(); renderSide(); setCam("wide");
    R3.camera.position.set(...CAMS.wide()[0]); R3.controls.target.set(...CAMS.wide()[1]);
    $("#auto").addEventListener("click", () => setAuto(!AUTO));
    document.querySelectorAll("[data-cam]").forEach((b) => b.addEventListener("click", () => { setAuto(false); setCam(b.dataset.cam); }));
    $("#play").addEventListener("click", () => { TL.playing = !TL.playing; $("#play").textContent = TL.playing ? "Pause" : "Play"; });
    document.querySelectorAll("[data-speed]").forEach((b) => b.addEventListener("click", () => { TL.speed = +b.dataset.speed; document.querySelectorAll("[data-speed]").forEach((x) => x.classList.toggle("on", x === b)); }));
    window.BNM = { go(k, f = 0.5) { const s = TL.st.find((x) => x.key === k); if (s) { TL.T = s.d0 + s.disp * f; TL.playing = false; } }, cam: (n) => { setAuto(false); setCam(n); R3.camera.position.set(...CAMS[n]()[0]); R3.controls.target.set(...CAMS[n]()[1]); camGoal = null; }, stages: () => TL.st.map((s) => s.key) };
    requestAnimationFrame(frame);
  } catch (e) { console.error(e); $("#ovStage").textContent = "The simulator did not start"; $("#ovText").textContent = String(e.message || e); }
})();
</script>
